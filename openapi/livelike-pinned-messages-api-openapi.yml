openapi: 3.2.0
info:
  title: engagement-suite Pinned Messages API
  version: '1'
servers:
- url: https://cf-blast.livelikecdn.com/api/v1
security:
- {}
tags:
- name: Pinned Messages
paths:
  /pinned-messages/:
    post:
      summary: Create a pin message
      description: ''
      operationId: create-a-pin-message
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                message_id:
                  type: string
                  description: A valid UUID generated while sending message
                message_payload:
                  type: string
                  description: A valid message json, that is being send
                  format: json
                chat_room_id:
                  type: string
                  description: A valid chat room id, for which the message is being pinned
      responses:
        '201':
          description: '201'
          content:
            application/json:
