      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                client_id:
                  type: string
                description:
                  type: string
                  default: ''
                  description: Default's value to file name
                file:
                  type: string
                  format: byte
                tags:
                  type: array
                  items:
                    type: string
                  description: ''
                create_variants_in_sync:
                  type: boolean
                  description: 'Forces the system to create variants synchronously, otherwise it will create the variants asynchronously.


                    WARNING: Please use the flag carefully as it may cause the request to timeout in case of huge files.'
                  default: 'false'
              required:
              - client_id
              - file
      tags:
      - Media
