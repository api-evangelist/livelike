paths:
  /media/:
    get:
      summary: List Assets
      description: ''
      operationId: list-assets
      parameters:
      - name: client_id
        in: query
        schema:
          type: string
          default: the ID of the application the asset was created under
      - in: query
        name: tag_name
        schema:
          type: string
        description: multiple tag_name query param supported to filter by multiple tag names
      - in: query
        name: search
        schema:
          type: string
        description: search by description
      - in: query
        name: tag_slug
        schema:
          type: string
        description: multiple tag_slug query param supported to filter by multiple tag slugs
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"count\": 20,\n    \"next\": null,\n    \"previous\": null,\n    \"results\": [\n        {\n            \"id\": \"2109ea19-f1bf-4eb6-9dd5-d9437b649054\",\n            \"url\": \"http://localhost/api/v1/media/2109ea19-f1bf-4eb6-9dd5-d9437b649054/\",\n            \"client_id\": \"FVQI5U57tfCyDV99YjhF3ExdlpiObg5JASvy81Mu\",\n            \"created_at\": \"2021-02-24T16:07:22.010000Z\",\n            \"description\": \"50 x 200\",\n            \"file\": \"http://localhost/media/assets/c5ad9911-d6dd-40f4-bd0f-63a2c1e4651f.png\",\n            \"mimetype\": \"image/png\",\n            \"tags\": []\n        },\n        {\n            \"id\": \"560e7bf3-4668-402b-810d-ca6686106c3c\",\n            \"url\": \"http://localhost/api/v1/media/560e7bf3-4668-402b-810d-ca6686106c3c/\",\n            \"client_id\": \"FVQI5U57tfCyDV99YjhF3ExdlpiObg5JASvy81Mu\",\n            \"created_at\": \"2021-02-24T16:07:21.741000Z\",\n            \"description\": \"50 x 450\",\n            \"file\": \"http://localhost/media/assets/f1a77113-d26d-40c1-b47f-0df53bbfe0fe.png\",\n            \"mimetype\": \"image/png\",\n            \"tags\": []\n        },\n\t\t ]\n}\n"
      security: []
