openapi: 3.2.0
info:
  title: engagement-suite Comments API
  version: '1'
servers:
- url: https://cf-blast.livelikecdn.com/api/v1
security:
- {}
tags:
- name: Comments
paths:
  /comments/:
    post:
      summary: Create a Comment
      description: ''
      operationId: create-a-comment
      parameters:
      - name: Authorization
        in: header
        description: Bearer Token
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - comment_board_id
              properties:
                comment_board_id:
                  type: string
                text:
                  type: string
                  description: Comment text
                custom_data:
                  type: string
                parent_comment_id:
                  type: string
                  description: Comment id of the parent comment for which this comment be treated as a reply
                attributes:
                  type: array
                  items:
                    properties:
                      key:
                        type: string
                      value:
                        type: string
                    required:
                    - key
                    - value
                    type: object
                is_excluded_from_trending:
                  type: boolean
                  default: 'false'
                is_excluded_from_quality:
                  type: boolean
                  default: 'false'
      responses:
        '201':
          description: '201'
          content:
            application/json:
              examples:
                New comment created:
                  value: "{\n    \"id\": \"69d1c606-7759-4aa7-9a8d-747da62d10e6\",\n    \"url\": \"https://cf-blast.livelikecdn.com/api/v1/comments/69d1c606-7759-4aa7-9a8d-747da62d10e6/\",\n    \"comment_board_id\": \"d849e096-d36d-406e-bff0-0627f13b19d4\",\n    \"parent_comment_id\": \"822b69ea-cee0-422b-b0f8-4001a8cdee01\",\n    \"thread_comment_id\": \"822b69ea-cee0-422b-b0f8-4001a8cdee01\",\n    \"text\": \"Sample Comment\",\n    \"comment_depth\": 1,\n    \"custom_data\": null,\n    \"author_id\": \"460c435b-d3b7-4add-bc63-628b0911f811\",\n    \"is_deleted\": false,\n    \"created_at\": \"2022-12-22T08:59:32.761643Z\",\n    \"replies_url\": null,\n    \"attributes\": [\n      \t{\n          \"key\": \"key-1\",\n          \"value\": \"value-1\"\n      \t}\n      ]\n}"
                  summary: New comment created
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: 69d1c606-7759-4aa7-9a8d-747da62d10e6
                  url:
                    type: string
                    example: https://cf-blast.livelikecdn.com/api/v1/comments/69d1c606-7759-4aa7-9a8d-747da62d10e6/
                  comment_board_id:
                    type: string
                    example: d849e096-d36d-406e-bff0-0627f13b19d4
                  parent_comment_id:
                    type: string
                    example: 822b69ea-cee0-422b-b0f8-4001a8cdee01
                  thread_comment_id:
                    type: string
                    example: 822b69ea-cee0-422b-b0f8-4001a8cdee01
                  text:
                    type: string
                    example: Sample Comment
                  comment_depth:
                    type: integer
                    example: 1
                    default: 0
                  custom_data: {}
                  author_id:
                    type: string
                    example: 460c435b-d3b7-4add-bc63-628b0911f811
                  is_deleted:
                    type: boolean
                    example: false
                    default: true
                  created_at:
                    type: string
                    example: '2022-12-22T08:59:32.761643Z'
                  replies_url: {}
                  attributes:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                          example: key-1
                        value:
                          type: string
                          example: value-1
                  is_excluded_from_quality:
                    type: boolean
                  is_excluded_from_trending:
                    type: boolean
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Too many mentions:
                  value:
                    mentions:
                      detail: You can mention at most 10 users in a comment.
                  summary: Too many mentions
                Mention index out of bounds:
                  summary: Mention index out of bounds
                  value:
                    mentions:
                      detail: Mention 'end_index' out of bounds, should be less than text length
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Comments
    get:
      summary: List comments
      description: ''
      operationId: list-comments
      parameters:
      - name: comment_board_id
        in: query
        required: true
        schema:
          type: string
        description: multiple comment_board_ids are accepted.
      - name: thread_comment_id
        in: query
        description: Comment thread ID
        schema:
          type: string
      - name: parent_comment_id
        in: query
        description: This will return all the replies to the parent_comment_id within that board
        schema:
          type: string
      - name: ordering
        in: query
        description: 1. created_at → default ordering, returns comments in ascending order of created_at 2. -created_at. → opposite of created at, returns comments in descending order of created_at, 3. reaction_count -> order by reaction_count , in desc order 4. -reaction_count -> opposite of reaction_count. 5. reply_count -> order by reply_count of a comments , in desc order 6. -reply_count -> opposite of reply_count 7. trending_score -> Order by trending score, most trending comment first 8. relationship -> at the top comments from author with specified relationship in order_relationship_type 9. -relationship -> opposite of relationship
        schema:
          type: string
          enum:
          - created_at
          - -created_at
          - reaction_count
          - -reaction_count
          - reply_count
          - -reply_count
          - trending_score
          - relationship
          - -relationship
          default: created_at
      - name: replied_since
        in: query
        description: Replies created time greater than or equal
        schema:
          type: string
      - name: replied_until
        in: query
        description: Replies created time less than or equal
        schema:
          type: string
      - name: top_level
        in: query
        description: Set to true to return only top level comments
        schema:
          type: boolean
      - name: is_reply
        in: query
        description: If the comment is a reply
        schema:
          type: boolean
      - name: is_reported
        in: query
        description: Reported Comments
        schema:
          type: boolean
      - name: is_deleted
        in: query
        description: Whether deleted comments should be included.  Setting is_deleted=False will exclude all deleted comments whether or not they have non-deleted replies.
        schema:
          type: boolean
      - name: without_deleted_thread
        in: query
        description: Set to true to exclude deleted threads in response
        schema:
          type: boolean
      - name: since
        in: query
        description: Filters comments created after this time.
        schema:
          type: string
          format: date
      - name: until
        in: query
        description: Filters comments created until this time.
        schema:
          type: string
          format: date
      - name: reaction_id
        in: query
        description: if want to sort comments by reaction_count on a specific reaction_id, this requires ordering as reaction_count, -reaction_count
        schema:
          type: string
      - name: attributes
        in: query
        description: filters comment by key, value pair eg. ?attributes=key:value
        schema:
          type: string
      - in: query
        name: relationship_type
        schema:
          type: string
        description: Unique keys for profile relationship types (Example - follow, friend)
      - in: query
        name: relationship_from_profile_id
        schema:
          type: string
        description: Profile UUID for the from_profile in a profile relationship. This parameter or an auth token for the from_profile is required with relationship_type.
      - in: query
        name: mentioned_profile_id
        schema:
          type: string
        description: Profile Id of mentioned user
      - in: query
        name: trending_score_gte
        schema:
          type: number
        description: Trending score greater than or equal to
      - in: query
        name: trending_score_lte
        schema:
          type: number
        description: Trending score less than or equal to
      - in: query
        name: is_high_quality
        schema:
          type: boolean
        description: Filter comments that have been categorized as high quality passing all comment quality rules
      - in: query
        name: per_board_limit
        schema:
          type: number
        description: Limit the number of comments for each passed comment board ID by a certain number
      - in: query
        name: ordering_relationship_type
        schema:
          type: string
        description: Returns a list of comments along with specified relationship between integrator and author at the top or bottom depends of ordering param. If this param is used ordering must have relationship or -relationship value.
      - in: query
        name: exclude_inactive_profile
        schema:
          type: boolean
        description: When set to true, excludes comments from authors whose profiles have been deactivated/deleted.
      - in: query
        name: without_reported_thread
        schema:
          type: boolean
          default: 'false'
        description: Use the without_reported_thread parameter to omit reported comments that have no replies. A reported parent comment that has replies remains visible so that its reply thread can still be rendered.
      - in: query
        name: inline_replies_ordering
        schema:
          type: string
          enum:
          - created_at
          - -created_at
          - reaction_count
          - -reaction_count
          - reply_count
          - -reply_count
          - trending_score
        description: Controls the ordering of inline replies returned when replies_limit is specified. Possible values are the same as for the ordering query parameter. If this parameter is not provided, the ordering falls back to the ordering parameter.
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    count: 1
                    next: null
                    previous: null
                    results:
                    - id: 3437f488-5c45-468b-8a14-c9b67ee77337
                      url: https://cf-blast.livelikecdn.com/api/v1/comments/3437f488-5c45-468b-8a14-c9b67ee77337/
                      comment_board_id: d849e096-d36d-406e-bff0-0627f13b19d4
                      parent_comment_id: null
                      thread_comment_id: 3437f488-5c45-468b-8a14-c9b67ee77337
                      text: test_comment
                      comment_depth: 0
                      custom_data: custom data
                      author_id: 96819c56-063d-4fad-929a-79a0648122f4
                      author:
                        id: 96819c56-063d-4fad-929a-79a0648122f4
                        url: https://cf-blast.livelikecdn.com/api/v1/profiles/96819c56-063d-4fad-929a-79a0648122f4/
                        created_at: '2023-01-24T13:52:13Z'
                        nickname: Mega Shot
                        custom_id: null
                        custom_data: ''
                      is_author_active: true
                      is_deleted: false
                      trending_score: 1.05439
                      created_at: '2022-12-09T13:06:39.379146Z'
                      replies_url: https://cf-blast.livelikecdn.com/api/v1/comments/?comment_board_id=d849e096-d36d-406e-bff0-0627f13b19d4&parent_comment_id=3437f488-5c45-468b-8a14-c9b67ee77337
                      replies_count: 3
                      attributes:
                      - key: key-1
                        value: value-1
                      reactions:
                      - reaction_id: ad6aea57-f4d3-4336-b12e-914147f3940b
                        count: 14
                        self_reacted_user_reaction_id: 2aed404b-e44f-4159-b53a-84cce0996203
                      - reaction_id: c4c3cb96-13d4-464b-9450-41a2fa7dc56f
                        count: 10
                        self_reacted_user_reaction_id: 3b99b9a5-c325-4c5c-be77-1f485d52c5e3
                      mentions:
                      - mentioned_profile_nickname: Risky Keeper
                        id: 3fe076c4-87e0-4237-a9ae-15410d0bca4a
                        start_index: 1
                        end_index: 2
                        mentioned_profile_id: 398245d6-23a2-4c60-be38-5d3386462770
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      tags:
      - Comments
  /comments/{comment_id}/dismiss-reports/:
