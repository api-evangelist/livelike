      operationId: dismiss-all-reports-for-a-reported-comment
      parameters:
      - name: Authorization
        in: header
        description: Bearer Token
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - report_status
              properties:
                report_status:
                  type: string
                  description: dismissed
      responses:
        '202':
          description: '202'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    “detail”: “All reports for this comment will be dismissed”\n}"
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Comments
