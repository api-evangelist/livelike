      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                multiplier_factor:
                  type: integer
                  description: Multiplier value applied to reward earnings (e.g. 2 = double rewards)
                activation_type:
                  type: string
                  enum:
                  - user_activated
                  - automatic
                  description: Defines how the multiplier is activated (e.g. user activated or automatic).
                active_duration:
                  type: string
                  description: Duration for which the user activated multiplier remains active after activation, in ISO 8601 format.
                started_at:
                  type: string
                  description: UTC timestamp when the multiplier becomes available. The timestamp should not be in the past.
                stopped_at:
                  type: string
                  description: UTC timestamp when the multiplier expires and stops being available. The timestamp should not be in the past.
                reward_item_ids:
                  type: array
                  items:
                    type: string
                  description: List of reward item UUIDs that the multiplier applies to.
                profile_group_ids:
                  type: array
                  items:
                    type: string
                  description: List of reward item UUIDs that the multiplier applies to.
              required:
              - name
              - multiplier_factor
              - activation_type
