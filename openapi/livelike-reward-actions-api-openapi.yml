      - Reward Actions
    post:
      summary: Create Reward Action
      description: ''
      operationId: creating-reward-actions
      parameters:
      - name: Authorization
        in: header
        description: Auth token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - key
              - client_id
              properties:
                name:
                  type: string
                  description: Action name
                description:
                  type: string
                  description: Action description
                key:
                  type: string
                  description: Reward action key
                client_id:
                  type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Reward Actions
