paths:
  /reward-actions/:
    get:
      summary: List Reward Actions
      description: Get list of reward actions for a given application.
      operationId: list-reward-actions
      parameters:
      - name: client_id
        in: query
        required: true
        schema:
          type: string
      - in: query
        name: type
        schema:
          type: string
          enum:
          - built-in
          - custom
          - segment
          - mparticle
          - vesper
          - gcp_pubsub
        description: Filters reward action by type
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n\t\"count\": 2,\n\t\"next\": null,\n\t\"previous\": null,\n\t\"results\": [\n\t\t{\n      \"client_id\": \"PPH7kWtZiasE6emxh3JUQ1aNKdoadFY3PYc8bB8m\",\n      \"description\": \"Logged In\",\n\t\t\t\"id\": \"426d9262-b052-4ecc-9010-f2989878a51a\",\n      \"key\": \"logged-in\",\n      \"name\": \"Logged In\",\n      \"type\": \"custom\",\n\t\t\t\"url\": \"https://cf-blast.livelikecdn.com/api/v1/reward-actions/426d9262-b052-4ecc-9010-f2989878a51a/\",\t\t\t\n\t\t},\n    {\n    \t\"client_id\": \"PPH7kWtZiasE6emxh3JUQ1aNKdoadFY3PYc8bB8m\",\n\t\t\t\"description\": null,\n\t\t\t\"id\": \"a5382f53-2611-48fe-94cd-f5a125c6b9ad\",\n\t\t\t\"key\": \"poll-voted\",\n    \t\"name\": \"Voted on a poll\",\n\t\t\t\"type\": \"built-in\",\n\t\t\t\"url\": \"https://cf-blast.livelikecdn.com/api/v1/reward-actions/a5382f53-2611-48fe-94cd-f5a125c6b9ad/\"\n    }\n\t]\n}"
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      security: []
      x-readme:
        code-samples:
        - language: curl
          code: 'curl --location --request GET ''https://cf-blast.livelikecdn.com/api/v1/reward-actions/'' \

