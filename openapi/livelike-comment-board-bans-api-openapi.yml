    get:
      summary: Get list of comment board bans
      description: '1. As a producer or privileged user I can see all the comment-board-ban-profile from the application

        2. As a moderator, I can get a list of all comment-board-ban-profile for the comment boards where I am a moderator

        3. As a normal profile, I will get a list of comment-board-ban-profile for myself only.'
      operationId: get-list-of-comment-board-bans
      parameters:
      - name: profile_id
        in: query
        schema:
          type: string
      - name: comment_board_id
        in: query
        schema:
          type: string
      - name: client_id
        in: query
        schema:
          type: string
      - name: Authorization
