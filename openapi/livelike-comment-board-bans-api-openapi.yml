    post:
      summary: Create a comment board ban
      description: ''
      operationId: create-comments-ban
      parameters:
      - name: Authorization
        in: header
        description: Bearer token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - profile_id
              properties:
                profile_id:
                  type: string
                comment_board_id:
                  type: string
                  description: if not provided, profile would be banned for entire application if the requesting user has the permission
                description:
                  type: string
      responses:
        '201':
          description: '201'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"id\": \"6f02c194-49aa-4d21-8de3-f433a6670808\",\n    \"url\": \"https://cf-blast.livelikecdn.com/api/v1/comment-board-bans/6f02c194-49aa-4d21-8de3-f433a6670808/\",\n    \"profile_id\": \"1d6b7e94-d52b-4934-9fc7-f07a5763d8e9\",\n    \"client_id\": \"lom9db0XtQUhOZQq1vz8QPfSpiyyxppiUVGMcAje\",\n    \"comment_board_id\": \"7fe49f7c-f3fe-47ac-b855-142713e3277d\",\n    \"banned_by_id\": \"bcdfff51-a9ac-48fa-ac98-bd2fcc0836ba\",\n    \"description\": \"custom ban description\",\n    \"created_at\": \"2023-03-10T10:34:40.136959Z\"\n}"
