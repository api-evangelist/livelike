openapi: 3.2.0
info:
  title: Livelike Profile Relationships API
  version: '1'
  description: 'Operations tagged Profile Relationships across 2 of this provider''s published API definitions: livelike-engagement-suite-openapi.yml, livelike-profiles-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://cf-blast.livelikecdn.com/api/v1
- url: https://cf-blast.livelikecdn.com/api/v1/profiles
security:
- {}
tags:
- name: Profile Relationships
paths:
  /profile-relationships/:
    post:
      summary: Create a Profile Relationship
      description: ''
      operationId: create-a-profile-relationship
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - relationship_type_key
              - from_profile_id
              - to_profile_id
              properties:
                relationship_type_key:
                  type: string
                  description: 'The `key` of the Relationship Type.  Example: `follow`'
                from_profile_id:
                  type: string
                  description: The ID of the user profile on the `from` side of the relationship.  When called with a Profile Access Token, this field must be the ID of the calling user.
                to_profile_id:
                  type: string
                  description: The ID of the user profile on the `to` side of the relationship.
      responses:
        '201':
          description: '201'
          content:
            application/json:
