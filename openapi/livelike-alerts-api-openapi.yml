  /alerts/:
    post:
      summary: Create an Alert
      description: ''
      operationId: create-an-alert
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - program_id
              - timeout
              properties:
                program_id:
                  type: string
                  description: The id of the program to create the Alert for
                title:
                  type: string
                  description: The title of the alert
                text:
                  type: string
                  description: The body text of the alert
                image_url:
                  type: string
                  description: The url of the body image
                link_label:
                  type: string
                  description: The label describing the link
                link_url:
                  type: string
                  description: The url of the link
                playback_time_ms:
                  type: integer
                  description: Playback time in milliseconds
                  format: int32
                timeout:
                  type: string
                  description: A iso8601 duration hint for when a Widget should be timed out
                custom_data:
                  type: string
                  description: A free-form field used for custom behaviors
                widget_attributes:
                  type: array
                  description: An array of key value pairs used for custom behaviors
                  items:
                    properties:
                      key:
                        type: string
                      value:
                        type: string
                    required:
                    - key
                    - value
                    type: object
                sponsor_ids:
                  type: array
                  description: Links the ```sponsors``` with this Alert. Note that only valid sponsor_ids will be linked to a Alert.
                  items:
                    type: string
