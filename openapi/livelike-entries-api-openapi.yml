openapi: 3.2.0
info:
  title: leaderboards Entries API
  version: '1'
servers:
- url: https://cf-blast.livelikecdn.com/api/v1/leaderboards
security:
- {}
tags:
- name: Entries
paths:
  /{id}/entries/:
    get:
      summary: List Leaderboard Entries
      description: A user that competes is considered a leaderboard entry. Retrieving leaderboard entries returns a paginated list of twenty leaderboard entry objects at maximum.
      operationId: getting-leaderboard-entries
      parameters:
      - name: id
        in: path
        description: Leaderboard Id
        schema:
          type: string
        required: true
      - name: profile_id
        in: query
        description: Query entries for the given Profile IDs.  Multiple parameters can be provided.
        schema:
          type: array
          items:
            type: string
      - name: view_id
        in: query
        description: Query entries for the give Leaderboard View ID.  Multiple parameters can be provided.
        schema:
          type: array
          items:
            type: string
      - name: page_size
        in: query
        description: The number of entries per page.  Default is 20, max is 100.
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"previous\": null,\n    \"count\": 171,\n    \"next\": \"https://blastrt-prod-us-east-1.livelikecdn.com/services/leaderboards/70bf764a-dce4-4c17-9529-a305c3b404f3/entries?start=20\",\n    \"results\": [\n        {\n            \"percentile_rank\": \"0.000\",\n            \"profile_id\": \"5429272d-4ba9-42e9-b26e-0cd13c138546\",\n            \"rank\": 1,\n            \"score\": 87955,\n            \"profile_nickname\": \"Ben\",\n            \"profile\": {\n                \"nickname\": \"Ben\",\n                \"created_at\": \"2020-05-23T17:27:08.408000+00:00\",\n                \"id\": \"5429272d-4ba9-42e9-b26e-0cd13c138546\",\n                \"subscribe_channel\": \"profile.5429272d-4ba9-42e9-b26e-0cd13c138546\",\n                \"chat_room_memberships_url\": \"https://blastrt-prod-us-east-1.livelikecdn.com/services/profiles/J97YLOHQ5sMGzww1BHivAEP0dUIfRgFl6ilg3asf/5429272d-4ba9-42e9-b26e-0cd13c138546/chat-room-memberships\",\n                \"url\": \"https://blastrt-prod-us-east-1.livelikecdn.com/services/profiles/J97YLOHQ5sMGzww1BHivAEP0dUIfRgFl6ilg3asf/5429272d-4ba9-42e9-b26e-0cd13c138546\",\n                \"reported_count\": 0,\n                \"custom_data\": null,\n                \"badges\": [],\n                \"points\": 0\n            }\n         }\n        }\n    ]\n}"
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      security: []
      tags:
      - Entries
  /{id}/entries/{profile_id}/:
    get:
      summary: Get Leaderboard Entry Detail
      description: ''
      operationId: get-leaderboard-entry-detail
      parameters:
      - name: id
        in: path
        description: Leaderboard Id
        schema:
          type: string
        required: true
      - name: profile_id
        in: path
        description: Profile Id
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"rank\":1,\n  \"percentile_rank\":\"0.000\",\n  \"score\":200,\n  \"profile_id\":\"c05ca-45fd-4459-891f-937885473b\",\n  \"profile_nickname\":\"Tricky Scorer\",\n  \"profile\":{\n    \"id\":\"c55d5ca-45fd-4459-891f-9378853c473b\",\n     \"url\":\"https://livelike.com/services/profiles/Jru/5ca-jk\",\n     \"created_at\":\"2020-07-02T14:42:59.627300Z\",\n     \"nickname\":\"Tricky Scorer\",\n     \"custom_data\":\"userdata: NULL\",\n     \"subscribe_channel\":\"profile.c0ca-45fd-459-891f-937473b\",\n     \"reported_count\":0,\n     \"chat_room_memberships_url\":\"https://blastrt-dev-us-east-1.livelikecdn.com/services/profiles/JsOcFru/c05dc473b/chat-room-memberships\"\n  }\n}"
              schema:
                type: object
                properties:
                  rank:
                    type: integer
                    example: 1
                    default: 0
                  percentile_rank:
                    type: string
                    example: '0.000'
                  score:
                    type: integer
                    example: 200
                    default: 0
                  profile_id:
                    type: string
                    example: c05ca-45fd-4459-891f-937885473b
                  profile_nickname:
                    type: string
                    example: Tricky Scorer
                  profile:
                    type: object
                    properties:
                      id:
                        type: string
                        example: c55d5ca-45fd-4459-891f-9378853c473b
                      url:
