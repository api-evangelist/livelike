                      reported_count:
                        type: integer
                        example: 0
                        default: 0
                      chat_room_memberships_url:
                        type: string
                        example: https://blastrt-dev-us-east-1.livelikecdn.com/services/profiles/JsOcFru/c05dc473b/chat-room-memberships
