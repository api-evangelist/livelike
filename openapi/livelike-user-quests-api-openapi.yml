                  value: "{\n    \"id\": \"d72db42f-ba64-427e-9482-03c0ffd75676\",\n    \"url\": \"https://cf-blast.livelikecdn.com/api/v1/user-quests/d72db42f-ba64-427e-9482-03c0ffd75676/\",\n    \"profile_id\": \"2394f364-6bd2-40af-8d3f-3ac0a3ca3749\",\n    \"quest_id\": \"e0494eb1-150b-4295-a158-afb38bde0709\",\n    \"created_at\": \"2022-08-29T10:01:37.045410Z\",\n    \"completed_at\": \"2022-08-29T10:07:04.164205Z\",\n    \"user_quest_tasks\": [\n        {\n            \"id\": \"6ef3675b-d276-41e4-935d-4f4553b8f117\",\n            \"status\": \"completed\",\n            \"created_at\": \"2022-08-29T10:01:37.250712Z\",\n            \"completed_at\": \"2022-08-29T10:07:04.113244Z\",\n            \"progress\": 10.0,\n            \"user_quest_id\": \"d72db42f-ba64-427e-9482-03c0ffd75676\",\n            \"quest_task\": {\n                \"id\": \"733e7675-0400-4799-a929-f9bcd61dd11e\",\n                \"name\": \"1\",\n                \"description\": \"a1\",\n                \"quest_id\": \"e0494eb1-150b-4295-a158-afb38bde0709\",\n                \"created_at\": \"2022-08-29T09:28:27.747014Z\",\n                \"default_progress_increment\": 2,\n                \"target_value\": 10\n            }\n        }\n    ],\n    \"user_quest_rewards_url\": \"https://cf-blast.livelikecdn.com/api/v1/user-quest-rewards/\",\n    \"status\": \"completed\",\n    \"rewards_status\": \"claimed\",\n    \"rewards_claimed_at\": \"2022-08-29T11:16:11.790511Z\",\n    \"quest\": {\n        \"id\": \"e0494eb1-150b-4295-a158-afb38bde0709\",\n        \"url\": \"https://cf-blast.livelikecdn.com/api/v1/quests/e0494eb1-150b-4295-a158-afb38bde0709/\",\n        \"client_id\": \"pnODbVXg0UI80s0l2aH5Y7FOuGbftoAdSNqpdvo6\",\n        \"name\": \"29AugTest\",\n        \"description\": \"abc\",\n        \"quest_tasks\": [\n            {\n                \"id\": \"733e7675-0400-4799-a929-f9bcd61dd11e\",\n                \"url\": \"https://cf-blast.livelikecdn.com/api/v1/quest-tasks/733e7675-0400-479