      description: ''
      operationId: delete-userquest
      parameters:
      - name: id
        in: path
        description: the quest id
        schema:
          type: string
        required: true
      responses:
        '204':
          description: '204'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - User Quests
  /user-quests/{quest_id}/badges:
    patch:
      summary: Claim User Quest Badge
      description: ''
      operationId: claim-user-quest-badges
      parameters:
      - in: path
        name: quest_id
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                claim_badges:
                  type: array
                  description: list of badges that should be awarded to user for completing the Quest
                  items:
                    type: string
      responses:
        '201':
          description: '201'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"user_quest_id\": \"fa1e61e9-6211-4943-ae10-8a5e4a0eaaa0\",\n    \"claimed_badges\": [\n        {\n            \"id\": \"c0dd5ab6-1b51-413e-9c3a-9d34074d5559\",\n            \"url\": \"http://localhost:8888/api/v1/badges/c0dd5ab6-1b51-413e-9c3a-9d34074d5559/\",\n            \"client_id\": \"kTytonx4hY0fI1rWrCtwdtacsj21pbuAn3Y4MrNr\",\n            \"name\": \"Badge 4\",\n            \"description\": \"desc\",\n            \"badge_icon_url\": \"/media/assets/9828393d-fabe-4540-b8ce-70e8230c7f85.jpg\",\n            \"mimetype\": \"application/octet-stream\",\n            \"registered_links\": [],\n            \"file\": \"http://localhost:8888/media/assets/9828393d-fabe-4540-b8ce-70e8230c7f85.jpg\",\n            \"attributes\": []\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  user_quest_id:
                    type: string
                    example: fa1e61e9-6211-4943-ae10-8a5e4a0eaaa0
                  claimed_badges:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: c0dd5ab6-1b51-413e-9c3a-9d34074d5559
                        url:
                          type: string
                          example: http://localhost:8888/api/v1/badges/c0dd5ab6-1b51-413e-9c3a-9d34074d5559/
                        client_id:
                          type: string
                          example: kTytonx4hY0fI1rWrCtwdtacsj21pbuAn3Y4MrNr
                        name:
                          type: string
                          example: Badge 4
                        description:
                          type: string
                          example: desc
                        badge_icon_url:
                          type: string
                          example: /media/assets/9828393d-fabe-4540-b8ce-70e8230c7f85.jpg
                        mimetype:
                          type: string
                          example: application/octet-stream
                        registered_links:
