                        attributes:
                          type: array
        '404':
          description: '404'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"detail\": \"Not found.\",\n    \"error_code\": \"not_found\"\n}"
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: Not found.
                  error_code:
                    type: string
                    example: not_found
      deprecated: false
      tags:
      - User Quests
  /user-quests/{user-quest-id}/:
    patch:
      summary: Claim user quest rewards
      description: ''
      operationId: claim-user-quest-rewards
      parameters:
      - name: user-quest-id
        in: path
        description: user_quest_id
        schema:
          type: string
        required: true
      - name: Authorization
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - rewards_status
              properties:
                rewards_status:
                  type: string
                  description: rewards_status can be claimed or unclaimed
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
