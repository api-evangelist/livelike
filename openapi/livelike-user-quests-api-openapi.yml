openapi: 3.2.0
info:
  title: engagement-suite User Quests API
  version: '1'
servers:
- url: https://cf-blast.livelikecdn.com/api/v1
security:
- {}
tags:
- name: User Quests
paths:
  /user-quests/:
    get:
      summary: List User Quests
      description: ''
      operationId: list-user-quests
      parameters:
      - name: client_id
        in: query
        description: Filter user quests to ones belonging to app with this client ID
        schema:
          type: string
      - name: profile_id
        in: query
        description: Filter user quests belonging to a profile
        schema:
          type: string
      - name: status
        in: query
        description: Filter user quests by completion status
        schema:
          type: string
          enum:
          - completed
          - incomplete
      - name: rewards_status
        in: query
        description: Filter user quests by whether rewards have been claimed
        schema:
          type: string
          enum:
          - claimed
          - unclaimed
      - name: quest_id
        in: query
        description: Filter user quests belonging to this quest ID
        schema:
          type: string
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - created_at
          - -created_at
        description: created_at. For descending order use "-" eg. -created_at.
      - in: query
        name: quest_status
        schema:
          type: string
          enum:
          - active
          - expired
          - inactive
        description: Filter user quests by status (active, expired, inactive).
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"previous\": null,\n    \"next\": null,\n    \"count\": 1\n    \"results\": [\n        {\n            \"created_at\": \"2024-07-11T07:23:57.000Z\",\n            \"quest_id\": \"285cd9f3-e59b-4ba7-8f97-350ade6e8da7\",\n            \"profile_id\": \"9d614bfc-fdda-4449-89f2-e90d893f13f1\",\n            \"timer_expired\": false,\n            \"quest\": {\n                \"description\": \"\",\n                \"started_at\": \"2024-07-09T12:00:00.000Z\",\n                \"attributes\": [],\n                \"stopped_at\": \"2024-07-31T12:00:00.000Z\",\n                \"quest_tasks\": [\n                    {\n                        \"description\": null,\n                        \"quest_id\": \"285cd9f3-e59b-4ba7-8f97-350ade6e8da7\",\n                        \"name\": \"Play Guess The Word\",\n                        \"default_progress_increment\": 1,\n                        \"target_value\": 5,\n                        \"attributes\": [\n                            {\n                                \"value\": \"minigame\",\n                                \"key\": \"application\"\n                            }\n                        ],\n                        \"id\": \"b0961afe-db2b-4e1f-b87e-2c633b0e14f0\",\n                        \"created_at\": \"2024-07-09T11:06:40.561Z\",\n                        \"url\": \"https://cf-blast.livelikecdn.com/api/v1/quest-tasks/b0961afe-db2b-4e1f-b87e-2c633b0e14f0/\"\n                    }\n                ],\n                \"client_id\": \"IDRa1FMkJTvkTFSLrLVDSVmGlnKV78B30TOTddNd\",\n                \"status\": \"active\",\n                \"created_at\": \"2024-07-09T11:06:40.509Z\",\n                \"timeout\": null,\n                \"id\": \"285cd9f3-e59b-4ba7-8f97-350ade6e8da7\",\n                \"name\": \"Play Game\",\n                \"quest_rewards_url\": \"https://cf-blast.livelikecdn.com/api/v1/quest-rewards/\",\n                \"url\": \"https://cf-blast.livelikecdn.com/api/v1/quests/285cd9f3-e59b-4ba7-8f97-350ade6e8da7/\"\n            },\n            \"rewards_claimed_at\": null,\n            \"rewards_status\": \"unclaimed\",\n            \"completed_at\": null,\n            \"status\": \"incomplete\",\n            \"user_quest_rewards_url\": \"https://cf-blast.livelikecdn.com/api/v1/user-quest-rewards/\",\n            \"id\": \"9ade0a87-a58d-44d8-a69a-1283425066b1\",\n            \"user_quest_tasks\": [\n                {\n                    \"status\": \"incomplete\",\n                    \"created_at\": \"2024-07-11T07:23:57.000Z\",\n                    \"progress\": 0,\n                    \"id\": \"f7bd3e9c-7150-4dbf-94a7-72a0c4aeda3c\",\n                    \"user_quest_id\": \"9ade0a87-a58d-44d8-a69a-1283425066b1\",\n                    \"quest_task\": {\n                        \"attributes\": [\n                            {\n                                \"value\": \"minigame\",\n                                \"key\": \"application\"\n                            }\n                        ],\n                        \"description\": null,\n                        \"name\": \"Play Guess The Word\",\n                        \"quest_id\": \"285cd9f3-e59b-4ba7-8f97-350ade6e8da7\",\n                        \"id\": \"b0961afe-db2b-4e1f-b87e-2c633b0e14f0\",\n                        \"default_progress_increment\": 1,\n                        \"created_at\": \"2024-07-09T11:06:40.561Z\",\n                        \"target_value\": 5\n                    },\n                    \"completed_at\": null\n                }\n            ],\n            \"url\": \"https://cf-blast.livelikecdn.com/api/v1/user-quests/9ade0a87-a58d-44d8-a69a-1283425066b1/\",\n            \"active_until\": null\n        }\n    ],\n}"
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - User Quests
    post:
      summary: Create User Quest
      description: ''
      operationId: create-user-quest
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - profile_id
              - quest_id
              properties:
                profile_id:
                  type: string
                  description: the profile for which the quest will be started under
                quest_id:
                  type: string
      responses:
        '201':
          description: '201'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n\t\"id\": \"0fb18b15-2f29-4996-9852-f3150bfa6793\",\n\t\"profile_id\": \"90dd4b66-1731-402f-91d8-f53e7a3829de\",\n\t\"created_at\": \"2022-06-27T21:41:45.259586Z\",\n\t\"user_quest_tasks\": [\n\t\t{\n\t\t\t\"id\": \"cf4672ed-767f-494f-8739-b545abd9f4a8\",\n      \"default_progress_increment\": 1,\n      \"progress\": 0,\n\t\t\t\"status\": \"incomplete\",\n\t\t\t\"created_at\": \"2022-06-27T21:41:45.331026Z\",\n\t\t\t\"completed_at\": null,\n\t\t\t\"user_quest_id\": \"0fb18b15-2f29-4996-9852-f3150bfa6793\",\n\t\t\t\"quest_task\": {\n\t\t\t\t\"id\": \"f19e1a92-a34d-4944-ad02-e8bc39c59c62\",\n\t\t\t\t\"name\": \"send 5 emails\",\n\t\t\t\t\"description:\": \"send 5 emails to complete the quest\",\n        \"progress_target_value\": 5,\n        \"default_progress_increment\": 1,\n\t\t\t\t\"quest_id\": \"e2f987ef-d644-44c4-bff7-03b440c885d2\",\n\t\t\t\t\"created_at\": \"2022-06-27T17:10:22.450723Z\"\n\t\t\t}\n\t\t}\n\t],\n\t\"status\": \"incomplete\",\n  \"completed_at\": null,\n\t\"quest\": {\n\t\t\"id\": \"f19e1a92-a34d-4944-ad02-e8bc39c59c62\",\n\t\t\"client_id\": \"FVQI5U57tfCyDV99YjhF3ExdlpiObg5JASvy81Mu\",\n\t\t\"name\": \"New Quest\",\n\t\t\"description\": \"\",\n\t\t\"quest_tasks\": [\n\t\t\t{\n\t\t\t\t\"id\": \"f19e1a92-a34d-4944-ad02-e8bc39c59c62\",\n\t\t\t\t\"name\": \"send 5 emails\",\n\t\t\t\t\"description:\": \"send 5 emails to complete the quest\",\n        \"progress_target_value\": 5,\n        \"default_progress_increment\": 1,\n\t\t\t\t\"quest_id\": \"e2f987ef-d644-44c4-bff7-03b440c885d2\",\n\t\t\t\t\"created_at\": \"2022-06-27T17:10:22.450723Z\"\n\t\t\t}\n\t\t]\n  }\n}"
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: 0fb18b15-2f29-4996-9852-f3150bfa6793
                  profile_id:
                    type: string
                    example: 90dd4b66-1731-402f-91d8-f53e7a3829de
                  created_at:
                    type: string
                    example: '2022-06-27T21:41:45.259586Z'
                  user_quest_tasks:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: cf4672ed-767f-494f-8739-b545abd9f4a8
                        default_progress_increment:
                          type: integer
                          example: 1
                          default: 0
                        progress:
                          type: integer
                          example: 0
                          default: 0
                        status:
                          type: string
                          example: incomplete
                        created_at:
                          type: string
                          example: '2022-06-27T21:41:45.331026Z'
                        completed_at: {}
                        user_quest_id:
                          type: string
                          example: 0fb18b15-2f29-4996-9852-f3150bfa6793
                        quest_task:
                          type: object
                          properties:
                            id:
                              type: string
                              example: f19e1a92-a34d-4944-ad02-e8bc39c59c62
                            name:
                              type: string
                              example: send 5 emails
                            'description:':
                              type: string
                              example: send 5 emails to complete the quest
                            progress_target_value:
                              type: integer
                              example: 5
                              default: 0
                            default_progress_increment:
                              type: integer
                              example: 1
                              default: 0
                            quest_id:
                              type: string
                              example: e2f987ef-d644-44c4-bff7-03b440c885d2
                            created_at:
                              type: string
                              example: '2022-06-27T17:10:22.450723Z'
                  status:
                    type: string
                    example: incomplete
                  completed_at: {}
                  quest:
                    type: object
                    properties:
                      id:
                        type: string
                        example: f19e1a92-a34d-4944-ad02-e8bc39c59c62
                      client_id:
                        type: string
                        example: FVQI5U57tfCyDV99YjhF3ExdlpiObg5JASvy81Mu
                      name:
                        type: string
                        example: New Quest
                      description:
                        type: string
                        example: ''
                      quest_tasks:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              example: f19e1a92-a34d-4944-ad02-e8bc39c59c62
                            name:
                              type: string
                              example: send 5 emails
                            'description:':
                              type: string
                              example: send 5 emails to complete the quest
                            progress_target_value:
                              type: integer
