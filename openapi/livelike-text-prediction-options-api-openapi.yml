paths:
  /text-prediction-options/:
    post:
      summary: Copy of Update Image Number Prediction Option
      description: ''
      operationId: patch_image-number-prediction-options{option_id}-1
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                prediction_id:
                  type: string
                  description: ID of the prediction widget
                description:
                  type: string
                  description: Option description
                reward_item_id:
                  type: string
                  description: The ID of the reward item to give when this option is correct
                reward_item_amount:
                  type: integer
                  description: The amount of the reward to give when this option is correct
                  format: int32
              required:
              - prediction_id
              - description
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Text Prediction Options
  /text-prediction-options/{option_id}/:
    patch:
      summary: Update Text Prediction Option
      description: ''
      operationId: update-text-prediction-option
      parameters:
      - name: option_id
        in: path
        description: The ID of the text prediction option
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reward_item_id:
                  type: string
                  description: The ID of the reward item to give when this option is correct
                reward_item_amount:
                  type: integer
                  description: The amount of the reward to give when this option is correct
                  format: int32
                is_correct:
                  type: boolean
                  description: Whether this is a correct option
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Text Prediction Options
