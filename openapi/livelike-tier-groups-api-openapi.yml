      - Tier Groups
  /tier-groups/{tier_group_id}/:
    patch:
      summary: Update Tier Group
      description: ''
      operationId: update-tier-group
      parameters:
      - name: tier_group_id
        in: path
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                title:
                  type: string
                attributes:
                  type: array
                  items:
                    properties:
                      key:
                        type: string
                      value:
                        type: string
                    required:
                    - key
                    - value
                    type: object
                image:
                  type: string
                  format: binary
                status:
                  type: string
                  enum:
                  - active
                  - archived
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"id\": \"ec1a5ec5-fd96-4787-ad55-76f5cb62f3d5\",\n    \"url\": \"https://cf-blast.livelikecdn.com/api/v1/tier-groups/ec1a5ec5-fd96-4787-ad55-76f5cb62f3d5/\",\n    \"title\": \"New Tier Group 2\",\n    \"status\": \"active\",\n    \"created_at\": \"2025-03-06T06:09:53.626798Z\",\n    \"client_id\": \"Iso1WANkUyFcsTod4iJ3ryFcYQOlOGmmZL3g0W5h\",\n    \"attributes\": [],\n    \"description\": null,\n    \"image_url\": null\n}"
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: ec1a5ec5-fd96-4787-ad55-76f5cb62f3d5
                  url:
                    type: string
                    example: https://cf-blast.livelikecdn.com/api/v1/tier-groups/ec1a5ec5-fd96-4787-ad55-76f5cb62f3d5/
                  title:
                    type: string
                    example: New Tier Group 2
                  status:
                    type: string
                    example: active
                  created_at:
                    type: string
                    example: '2025-03-06T06:09:53.626798Z'
                  client_id:
                    type: string
                    example: Iso1WANkUyFcsTod4iJ3ryFcYQOlOGmmZL3g0W5h
                  attributes:
                    type: array
                  description: {}
                  image_url: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"detail\": \"Only the 'status' field can be updated for archived TierGroups.\",\n    \"error_code\": \"invalid\"\n}"
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: Only the 'status' field can be updated for archived TierGroups.
                  error_code:
                    type: string
                    example: invalid
      deprecated: false
      tags:
      - Tier Groups
