paths:
  /tier-groups/:
    post:
      summary: Create Tier Group
      description: ''
      operationId: create-tier-group
      parameters:
      - name: Authorization
        in: header
        description: Producer token is required
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - client_id
              - title
              properties:
                client_id:
                  type: string
                title:
                  type: string
                description:
                  type: string
                image:
                  type: string
                attributes:
                  type: array
                  description: key and value pairs
                  items:
                    properties:
                      key:
                        type: string
                      value:
                        type: string
                    required:
                    - key
                    - value
                    type: object
      responses:
        '201':
          description: '201'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"id\": \"b3d57ed7-b2fe-4e36-a1b5-729bf4870923\",\n    \"url\": \"https://cf-blast.livelikecdn.com/api/v1/tier-groups/b3d57ed7-b2fe-4e36-a1b5-729bf4870923/\",\n    \"title\": \"Loyalty Tiers\",\n    \"status\": \"active\",\n    \"created_at\": \"2025-04-08T03:44:11.960422Z\",\n    \"client_id\": \"Iso1WANkUyFcsTod4iJ3ryFcYQOlOGmmZL3g0W5h\",\n    \"attributes\": [\n        {\n            \"key\": \"test\",\n            \"value\": \"yes\"\n        }\n    ],\n    \"description\": null,\n    \"image_url\": \"https://cf-blast-storage-us-east-1.livelikeblast.com/assets/8f944313-87f9-4a67-bf37-51116649efd4.png\"\n}"
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: b3d57ed7-b2fe-4e36-a1b5-729bf4870923
                  url:
                    type: string
                    example: https://cf-blast.livelikecdn.com/api/v1/tier-groups/b3d57ed7-b2fe-4e36-a1b5-729bf4870923/
                  title:
                    type: string
                    example: Loyalty Tiers
                  status:
                    type: string
                    example: active
                  created_at:
                    type: string
                    example: '2025-04-08T03:44:11.960422Z'
