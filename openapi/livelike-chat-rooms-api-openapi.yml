                  description: 'To manage the type of messages allowed in a chat room, we provide three levels of content filtering. Each level determines how messages are moderated and who is allowed to post. **1.** `none`: No content filtering, all users can post freely.  **2.**`filtered`: Profanity is automatically filtered.  **3.** `producer`: Only producers can post, others can view messages only. **4.** `ai`: message recognized by an AI model as objectionable, will be filtered.'
                  default: none
                  enum:
                  - none
                  - filtered
                  - producer
                  - ai
                sticker_pack_ids:
                  type: array
                  description: Sticker Pack IDs
                  items:
                    type: string
                reaction_pack_ids:
                  type: array
                  description: Reaction Pack IDs
                  items:
                    type: string
                visibility:
