        in: query
        description: The Client ID of the application to get list of associated chat rooms from.
        schema:
          type: string
      - name: attributes
        in: query
        description: Filters Chat on the basis of their attributes, ?attributes=key:value
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    id: 5052ea2f-0cb4-4fb6-bec8-fe275826b266
                    url: https://cf-blast.livelikecdn.com/api/v1/chat-rooms/5052ea2f-0cb4-4fb6-bec8-fe275826b266/
