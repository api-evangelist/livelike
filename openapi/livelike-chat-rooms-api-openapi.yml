info:
  title: Livelike Chat Rooms API
  version: '1'
  description: 'Operations tagged Chat Rooms across 3 of this provider''s published API definitions: livelike-chat-rooms-openapi.yml, livelike-engagement-suite-openapi.yml, livelike-programs-openapi.yml. Each path carries the servers of the definition it was published in.'
