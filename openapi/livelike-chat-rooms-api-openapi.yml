                  default: everyone
                  enum:
                  - everyone
                  - members
                sponsor_ids:
                  type: array
                  description: Links the sponsors with this chat room. Note that only valid sponsor IDs will be linked to a chatroom.
                  items:
                    type: string
                token_gates:
                  type: array
                  description: Token gates users must pass to access the chat
                  items:
                    properties:
                      contract_address:
                        type: string
