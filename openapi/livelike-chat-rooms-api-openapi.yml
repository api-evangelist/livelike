    post:
      summary: Create a Chat Room
      description: Create a new chat room
      operationId: create-chat-room
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: Set an optional title for the Chat Room
                content_filter:
                  type: string
                  description: 'To manage the type of messages allowed in a chat room, we provide three levels of content filtering. Each level determines how messages are moderated and who is allowed to post. **1.** `none`: No content filtering, all users can post freely.  **2.**`filtered`: Profanity is automatically filtered.  **3.** `producer`: Only producers can post, others can view messages only. **4.** `ai`: message recognized by an AI model as objectionable, will be filtered.'
                  default: none
                  enum:
                  - none
                  - filtered
                  - producer
                  - ai
                sticker_pack_ids:
                  type: array
                  description: Sticker Pack IDs
                  items:
                    type: string
                reaction_pack_ids:
                  type: array
                  description: Reaction Pack IDs
                  items:
                    type: string
                visibility:
                  type: string
                  description: Who is allowed to see and join the chat room.  Can be `everyone` or `members`.
                  default: members
                  enum:
                  - everyone
                  - members
                sponsor_ids:
                  type: array
                  description: Sets the sponsors associated with the chat room
                  items:
                    type: string
                token_gates:
                  type: array
                  description: Set an optional crypto token gates over chat
                  items:
                    properties:
                      contract_address:
                        type: string
                        description: address of smart contract whose token will be used as gate
                      network_type:
                        type: string
                        description: define network in which above contract is a block
                        enum:
                        - ethereum
                        - polygon
                        - chiliz
                        - hedera
                      token_type:
                        type: string
                        default: fungible
                        enum:
                        - non-fungible
                        - fungible
                      attributes:
                        type: array
                        description: Attributes are only attched with non-fungible type token-gates
                        items:
                          properties:
                            key:
                              type: string
                            value:
                              type: string
                          type: object
                    type: object
                attributes:
                  type: array
                  description: Array of custom attributes
                  items:
                    properties:
                      key:
                        type: string
                      value:
                        type: string
                    type: object
                chat_message_throttle_seconds:
                  type: number
                  description: Set chat messages throttling
                  default: '0'
                profile_groups:
                  type: array
                  items:
                    type: string
                  description: Array of user groups you want to link to the chat room
            examples:
              Request Example:
                value:
                  content_filter: none
                  visibility: everyone
                  title: example chat name
                  token_gates:
                  - contract_address: '0xe60ede23D15Cc5e1807DeC001DA44f9B24d1e458'
                    network_type: ethereum
                  profile_groups: []
