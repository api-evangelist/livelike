openapi: 3.2.0
info:
  title: chat-rooms Custom Messages API
  version: '1'
servers:
- url: https://cf-blast.livelikecdn.com/api/v1/chat-rooms
security:
- {}
tags:
- name: Custom Messages
paths:
  /{chat_room_id}/custom-messages/:
    post:
      summary: Send a Custom Chat Message
      description: Send a custom message to a chat room. This can be used to send rich data as a chat message that can be interpreted by the SDK to perform some action or display additional content.
      operationId: send-a-custom-chat-message
      parameters:
      - name: chat_room_id
        in: path
        description: Chat Room ID
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - custom_data
              properties:
                custom_data:
                  type: string
                  description: String data to send with the chat message.  Typically contains a string JSON payload to be decoded by the client SDK
                program_date_time:
                  type: string
                  description: ISO-8601 Program Date Time to associate with the chat message.
                  format: date
      responses:
        '201':
          description: '201'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"id\": \"9709cc92-83b3-4e32-b2d0-9029b2f2a0d8\",\n    \"chat_room_id\": \"1b494165-188f-4e16-9766-ac1d1f1ac925\",\n    \"sender_id\": \"c8d2922f-8324-4a9a-97f6-88851c53d331\",\n    \"sender_nickname\": \"Gautam Aggarwal\",\n    \"sender_image_url\": null,\n    \"badge_image_url\": null,\n    \"sender_profile_url\": \"https://cf-blast.livelikecdn.com/api/v1/profiles/c8d2922f-8324-4a9a-97f6-88851c53d331/\",\n    \"created_at\": \"2021-09-16T12:24:32.423815+00:00\",\n    \"custom_data\": \"{\\\"text\\\": \\\"This is a custom chat message\\\"}\",\n    \"program_date_time\": null\n}"
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: 9709cc92-83b3-4e32-b2d0-9029b2f2a0d8
                  chat_room_id:
                    type: string
                    example: 1b494165-188f-4e16-9766-ac1d1f1ac925
                  sender_id:
                    type: string
                    example: c8d2922f-8324-4a9a-97f6-88851c53d331
                  sender_nickname:
                    type: string
                    example: Gautam Aggarwal
                  sender_image_url: {}
                  badge_image_url: {}
                  sender_profile_url:
                    type: string
                    example: https://cf-blast.livelikecdn.com/api/v1/profiles/c8d2922f-8324-4a9a-97f6-88851c53d331/
                  created_at:
                    type: string
                    example: '2021-09-16T12:24:32.423815+00:00'
                  custom_data:
                    type: string
                    example: '{"text": "This is a custom chat message"}'
                  program_date_time: {}
        '403':
          description: '403'
          content:
            application/json:
              examples:
                Result:
                  value: '{"detail": "Authentication credentials were invalid or not provided."}'
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: Authentication credentials were invalid or not provided.
      deprecated: false
      tags:
      - Custom Messages
