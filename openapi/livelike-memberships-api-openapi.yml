openapi: 3.2.0
info:
  title: chat-rooms Memberships API
  version: '1'
servers:
- url: https://cf-blast.livelikecdn.com/api/v1/chat-rooms
security:
- {}
tags:
- name: Memberships
paths:
  /{id}/memberships/:
    get:
      summary: List Chat Room Memberships
      description: ''
      operationId: list-chat-room-memberships
      parameters:
      - name: id
        in: path
        description: Chat Room ID
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"count\": 2,\n  \"next\": null,\n  \"previous\": null,\n  \"results\": [\n    {\n      \"id\": \"5c92f58f-f987-4269-8a32-83efa6693999\",\n      \"url\": \"https://cf-blast.livelikecdn.com/api/v1/chat-room-memberships/5c92f58f-f987-4269-8a32-83efa6693999/\",\n      \"profile\": {\n        \"id\": \"26b0cae1-3890-486c-b6c0-0b36005c76d6\",\n        \"url\": \"https://cf-blast.livelikecdn.com/api/v1/profiles/26b0cae1-3890-486c-b6c0-0b36005c76d6/\",\n        \"created_at\": \"2020-04-16T23:15:07.550000Z\",\n        \"nickname\": \"Wise Bee\",\n        \"subscribe_channel\": \"profile.26b0cae1-3890-486c-b6c0-0b36005c76d6\",\n        \"reported_count\": 0,\n        \"chat_room_memberships_url\": \"https://cf-blast.livelikecdn.com/api/v1/profiles/26b0cae1-3890-486c-b6c0-0b36005c76d6/chat-room-memberships/\"\n      }\n    },\n    {\n      \"id\": \"2bd41d2c-423a-4229-b6db-7909bc002e53\",\n      \"url\": \"https://cf-blast.livelikecdn.com/api/v1/chat-room-memberships/2bd41d2c-423a-4229-b6db-7909bc002e53/\",\n      \"profile\": {\n        \"id\": \"988b06e6-fa35-4590-9d2e-9572fb28e702\",\n        \"url\": \"https://cf-blast.livelikecdn.com/api/v1/profiles/988b06e6-fa35-4590-9d2e-9572fb28e702/\",\n        \"created_at\": \"2020-04-16T23:15:07.544000Z\",\n        \"nickname\": \"Dangerous Snake\",\n        \"subscribe_channel\": \"profile.988b06e6-fa35-4590-9d2e-9572fb28e702\",\n        \"reported_count\": 0,\n        \"chat_room_memberships_url\": \"https://cf-blast.livelikecdn.com/api/v1/profiles/988b06e6-fa35-4590-9d2e-9572fb28e702/chat-room-memberships/\"\n      }\n    }\n  ]\n}\n"
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    example: 2
                    default: 0
                  next: {}
                  previous: {}
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: 5c92f58f-f987-4269-8a32-83efa6693999
                        url:
                          type: string
                          example: https://cf-blast.livelikecdn.com/api/v1/chat-room-memberships/5c92f58f-f987-4269-8a32-83efa6693999/
                        profile:
                          type: object
                          properties:
                            id:
                              type: string
                              example: 26b0cae1-3890-486c-b6c0-0b36005c76d6
                            url:
                              type: string
                              example: https://cf-blast.livelikecdn.com/api/v1/profiles/26b0cae1-3890-486c-b6c0-0b36005c76d6/
                            created_at:
                              type: string
                              example: '2020-04-16T23:15:07.550000Z'
                            nickname:
                              type: string
                              example: Wise Bee
                            subscribe_channel:
                              type: string
                              example: profile.26b0cae1-3890-486c-b6c0-0b36005c76d6
                            reported_count:
                              type: integer
                              example: 0
                              default: 0
                            chat_room_memberships_url:
                              type: string
                              example: https://cf-blast.livelikecdn.com/api/v1/profiles/26b0cae1-3890-486c-b6c0-0b36005c76d6/chat-room-memberships/
      deprecated: false
      security: []
      tags:
      - Memberships
    post:
      summary: Create a Chat Room Membership
      description: ''
      operationId: create-a-chat-room-membership
      parameters:
      - name: id
        in: path
        description: Chat Room ID
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                profile_id:
                  type: string
                  description: profile_id field must be null if you want to join the chatroom, if profile_id field is provided then that profile will be added to the chatroom provided the user who is adding is already a member of that chatroom
                  default: 'null'
      responses:
        '201':
          description: '201'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"id\": \"26bf2b90-87cc-4e0e-860b-58e6c5e36ec0\",\n    \"url\": \"https://cf-blast.livelikecdn.com/api/v1/chat-room-memberships/26bf2b90-87cc-4e0e-860b-58e6c5e36ec0/\",\n    \"created_at\": \"2021-09-16T12:01:48.342229Z\",\n    \"profile\": {\n        \"id\": \"dfb92c93-6a00-44cf-bb03-09ea52684043\",\n        \"url\": \"https://cf-blast.livelikecdn.com/api/v1/profiles/dfb92c93-6a00-44cf-bb03-09ea52684043/\",\n        \"created_at\": \"2021-09-14T07:54:53Z\",\n        \"nickname\": \"Alpha Dynamo\",\n        \"custom_data\": \"\",\n        \"badges\": [],\n        \"badges_url\": \"https://cf-blast.livelikecdn.com/api/v1/profiles/dfb92c93-6a00-44cf-bb03-09ea52684043/badges/\",\n        \"subscribe_channel\": \"profile.dfb92c93-6a00-44cf-bb03-09ea52684043\",\n        \"reported_count\": 0,\n        \"chat_room_memberships_url\": \"https://cf-blast.livelikecdn.com/api/v1/profiles/dfb92c93-6a00-44cf-bb03-09ea52684043/chat-room-memberships/\"\n    }\n}"
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: 26bf2b90-87cc-4e0e-860b-58e6c5e36ec0
                  url:
                    type: string
                    example: https://cf-blast.livelikecdn.com/api/v1/chat-room-memberships/26bf2b90-87cc-4e0e-860b-58e6c5e36ec0/
                  created_at:
                    type: string
                    example: '2021-09-16T12:01:48.342229Z'
                  profile:
                    type: object
                    properties:
                      id:
                        type: string
                        example: dfb92c93-6a00-44cf-bb03-09ea52684043
                      url:
                        type: string
                        example: https://cf-blast.livelikecdn.com/api/v1/profiles/dfb92c93-6a00-44cf-bb03-09ea52684043/
                      created_at:
                        type: string
                        example: '2021-09-14T07:54:53Z'
                      nickname:
                        type: string
                        example: Alpha Dynamo
                      custom_data:
                        type: string
                        example: ''
                      badges:
                        type: array
                      badges_url:
                        type: string
                        example: https://cf-blast.livelikecdn.com/api/v1/profiles/dfb92c93-6a00-44cf-bb03-09ea52684043/badges/
                      subscribe_channel:
                        type: string
                        example: profile.dfb92c93-6a00-44cf-bb03-09ea52684043
                      reported_count:
                        type: integer
                        example: 0
                        default: 0
                      chat_room_memberships_url:
                        type: string
                        example: https://cf-blast.livelikecdn.com/api/v1/profiles/dfb92c93-6a00-44cf-bb03-09ea52684043/chat-room-memberships/
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"profile_id\": [\n        \"Must be a valid UUID.\"\n    ]\n}"
              schema:
                type: object
                properties:
                  profile_id:
                    type: array
                    items:
                      type: string
                      example: Must be a valid UUID.
        '403':
          description: '403'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"detail\": \"cannot add profile, since you are not a part of this chatroom.\"\n}"
              schema:
                oneOf:
                - type: object
                  properties:
                    detail:
                      type: string
                      example: application profile mismatch.
                - type: object
                  properties:
                    detail:
                      type: string
                      example: cannot add profile, since you are not a part of this chatroom.
        '409':
          description: '409'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"detail\": \"membership already exists.\"\n}"
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: membership already exists.
      deprecated: false
      tags:
      - Memberships
