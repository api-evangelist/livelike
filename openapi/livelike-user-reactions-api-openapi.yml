info:
  title: engagement-suite User Reactions API
  version: '1'
servers:
- url: https://cf-blast.livelikecdn.com/api/v1
security:
- {}
tags:
- name: User Reactions
paths:
  /user-reactions/:
    post:
      summary: Create user reaction
      description: ''
      operationId: create-a-user-reaction
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - reaction_id
              - reaction_space_id
              - target_id
              properties:
                reaction_id:
                  type: string
                  description: The ID of the reaction type from the reaction pack
                reaction_space_id:
                  type: string
                target_id:
                  type: string
                  description: The ID of the entity being reacted to, e.g. a chat message ID, or a custom ID from your system
                custom_data:
                  type: string
                target_type:
                  type: string
                  description: Specifies the type of entity the user is reacting to. When provided, it must be one of "comment", "chat-message", or "rich-post".
                  enum:
                  - comment
                  - chat-message
                  - rich-post
      responses:
        '201':
          description: '201'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"reaction_space_id\": \"7b7a229a-f34f-46df-9933-7d1f7a0b7d2f\",\n    \"target_id\": \"86io\",\n    \"reaction_id\": \"b08ce04d-6fbd-40e4-b20d-879471f91daa\",\n    \"id\": \"53d3a78c-d88d-4f78-b1c5-2353e3e2ace5\",\n    \"client_id\": \"pnODbVXg0UI80s0l2aH5Y7FOuGbftoAdSNqpdvo6\",\n    \"reacted_by_id\": \"e0a92904-2c6c-400e-93ba-d379142f06cc\",\n    \"created_at\": \"2022-08-24T13:29:40+0000\",\n    \"url\": \"https://cf-blast.livelikecdn.com/api/v1/user-reactions/53d3a78c-d88d-4f78-b1c5-2353e3e2ace5/\",\n    \"custom_data\": null\n}"
              schema:
                type: object
                properties:
                  reaction_space_id:
                    type: string
                    example: 7b7a229a-f34f-46df-9933-7d1f7a0b7d2f
                  target_id:
                    type: string
                    example: 86io
                  reaction_id:
                    type: string
                    example: b08ce04d-6fbd-40e4-b20d-879471f91daa
                  id:
                    type: string
                    example: 53d3a78c-d88d-4f78-b1c5-2353e3e2ace5
                  client_id:
                    type: string
                    example: pnODbVXg0UI80s0l2aH5Y7FOuGbftoAdSNqpdvo6
                  reacted_by_id:
                    type: string
                    example: e0a92904-2c6c-400e-93ba-d379142f06cc
                  created_at:
                    type: string
                    example: 2022-08-24T13:29:40+0000
                  url:
                    type: string
                    example: https://cf-blast.livelikecdn.com/api/v1/user-reactions/53d3a78c-d88d-4f78-b1c5-2353e3e2ace5/
                  custom_data: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      tags:
      - User Reactions
    get:
      summary: List user reactions
      description: ''
      operationId: list-user-reactions
      parameters:
      - name: client_id
        in: query
        required: true
        schema:
          type: string
      - name: reaction_space_id
        in: query
        description: Repeat this parameter for multiple reaction spaces. Limit 100 different spaces.
        required: true
        schema:
          type: string
      - name: target_group_id
        in: query
        description: Either reaction-space_id or target_group_id is required. Repeat this parameter for multiple target group IDs. Limit 100.
        required: true
        schema:
          type: string
      - name: target_id
        in: query
        description: there can be multiple target_id filters eg, target_id=abcd&target_id=1234
        schema:
          type: string
      - name: reaction_id
        in: query
        schema:
          type: string
      - name: reacted_by_id
        in: query
        schema:
          type: string
      - in: query
        name: relationship_type
        schema:
          type: string
        description: Unique keys for profile relationship types (Example - follow, friend)
      - in: query
        name: relationship_from_profile_id
        schema:
          type: string
        description: Profile UUID for the from_profile in a profile relationship. This parameter or an auth token for the from_profile is required with relationship_type.
      - in: query
        name: per_space_limit
        schema:
          type: string
        description: Integer between 1 and 100
      - in: query
        name: page_size
        schema:
          type: string
          default: '20'
        description: Up to a maximum of 100 (values above that are clamped to 100)
      - in: query
        name: page
        schema:
          type: string
          default: '1'
        description: page number
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"previous\": null,\n    \"next\": null,\n    \"count\": 3\n    \"results\": [\n        {\n            \"reaction_space_id\": \"7b7a229a-f34f-46df-9933-7d1f7a0b7d2f\",\n            \"target_id\": \"86io\",\n            \"target_type\": \"comment\",\n            \"reaction_id\": \"b08ce04d-6fbd-40e4-b20d-879471f91daa\",\n            \"id\": \"53d3a78c-d88d-4f78-b1c5-2353e3e2ace5\",\n            \"client_id\": \"pnODbVXg0UI80s0l2aH5Y7FOuGbftoAdSNqpdvo6\",\n            \"reacted_by_id\": \"e0a92904-2c6c-400e-93ba-d379142f06cc\",\n            \"reacted_by_nickname\": \"Strong Striker\",\n            \"reacted_by_custom_id\": \"user_custom_id_123\",\n            \"created_at\": \"2022-08-24 13:29:40+00\",\n            \"target_group_id\": \"test26\",\n            \"custom_data\": null,\n            \"url\": \"https://cf-blast.livelikecdn.com/api/v1/user-reactions/53d3a78c-d88d-4f78-b1c5-2353e3e2ace5/\"\n        },\n        {\n            \"reaction_space_id\": \"7b7a229a-f34f-46df-9933-7d1f7a0b7d2f\",\n            \"target_id\": \"86iop\",\n            \"target_type\": \"chat-message\",\n            \"reaction_id\": \"b08ce04d-6fbd-40e4-b20d-879471f91daa\",\n            \"id\": \"878b5522-80b5-43d5-8a9b-1a704060a2f1\",\n            \"client_id\": \"pnODbVXg0UI80s0l2aH5Y7FOuGbftoAdSNqpdvo6\",\n            \"reacted_by_id\": \"e0a92904-2c6c-400e-93ba-d379142f06cc\",\n            \"reacted_by_nickname\": \"Quirky Champion\",\n            \"reacted_by_custom_id\": null,\n            \"created_at\": \"2022-07-29 14:55:23+00\",\n            \"target_group_id\": \"test26\",\n            \"custom_data\": null,\n            \"url\": \"https://cf-blast.livelikecdn.com/api/v1/user-reactions/878b5522-80b5-43d5-8a9b-1a704060a2f1/\"\n        },\n        {\n            \"reaction_space_id\": \"7b7a229a-f34f-46df-9933-7d1f7a0b7d2f\",\n            \"target_id\": \"test26\",\n            \"target_type\": null,\n            \"reaction_id\": \"b08ce04d-6fbd-40e4-b20d-879471f91daa\",\n            \"id\": \"519b7fa6-51f5-4d94-ad9e-24fb2e579ef6\",\n            \"client_id\": \"pnODbVXg0UI80s0l2aH5Y7FOuGbftoAdSNqpdvo6\",\n            \"reacted_by_id\": \"e0a92904-2c6c-400e-93ba-d379142f06cc\",\n            \"reacted_by_nickname\": \"Strong Striker\",\n            \"reacted_by_custom_id\": \"user_custom_id_123\",\n            \"created_at\": \"2022-07-27 11:04:35+00\",\n            \"target_group_id\": \"test26\",\n            \"custom_data\": null,\n            \"url\": \"https://cf-blast.livelikecdn.com/api/v1/user-reactions/519b7fa6-51f5-4d94-ad9e-24fb2e579ef6/\"\n        }\n    ],\n}"
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      tags:
      - User Reactions
  /user-reactions/{id}:
    delete:
      summary: Delete a user reaction
      description: ''
      operationId: delete-a-user-reaction
      parameters:
      - name: id
        in: path
        schema:
          type: string
        required: true
      responses:
        '204':
          description: '204'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - User Reactions
