- {}
tags:
- name: Batch Invoked Actions
paths:
  /batch-invoked-actions/:
    post:
      summary: Batch Invoke Reward Action
      description: ''
      operationId: batch-invoke-reward-action
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                program_id:
                  type: string
                  description: Program ID
                updates:
                  type: array
                  items:
                    properties:
                      profile_id:
                        type: string
                        description: Either profile_id or custom_profile_id is required
                      reward_actions:
                        type: array
                        default: []
                        items:
                          properties:
                            reward_action_key:
                              type: string
                              description: Reward action key
                            attributes:
                              type: array
                              items:
                                properties:
                                  key:
                                    type: string
                                  value:
                                    type: string
                                type: object
                              description: Attributes array
                          type: object
                          required:
                          - reward_action_key
                      custom_profile_id:
                        type: string
                        description: Either profile_id or custom_profile_id is required
                      code:
                        type: string
                        description: Integrator-defined disambiguation code
                    type: object
                    required:
                    - reward_actions
              required:
              - program_id
              - updates
      responses:
        '201':
          description: '201'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"request_id\": \"9abeef82-cca6-4ba5-9f96-0d306069ac6c\",\n    \"program_id\": \"73127b3b-570b-47a0-81c4-ce0929fd5cf7\",\n    \"updates\": [\n        {\n            \"reward_actions\": [\n                {\n                    \"rewards\": [\n                        {\n                            \"reward_name\": \"Tier points\",\n                            \"reward_item_id\": \"325751e7-3787-495f-a6be-f674172de16c\",\n                            \"amount\": 30\n                        },\n                        {\n                            \"reward_name\": \"Test item\",\n                            \"reward_item_id\": \"986d35f4-f5b9-4d50-b512-c98ddf3998ba\",\n                            \"amount\": 50\n                        }\n                    ],\n                    \"status\": \"success\",\n                    \"reason\": null,\n                    \"reward_action_key\": \"prediction-correct\",\n                    \"invoked_action_id\": \"003f3f71-afe9-484a-9c7e-7325a1715589\"\n                }\n            ],\n            \"reason\": null,\n            \"profile_id\": \"b6bb8205-22ee-4c67-9482-424331d65aa4\",\n            \"status\": \"success\"\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                    example: 9abeef82-cca6-4ba5-9f96-0d306069ac6c
                  program_id:
                    type: string
                    example: 73127b3b-570b-47a0-81c4-ce0929fd5cf7
                  updates:
                    type: array
                    items:
                      type: object
                      properties:
                        reward_actions:
                          type: array
                          items:
                            type: object
                            properties:
                              rewards:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    reward_name:
                                      type: string
                                      example: Tier points
                                    reward_item_id:
                                      type: string
                                      example: 325751e7-3787-495f-a6be-f674172de16c
                                    amount:
                                      type: integer
                                      example: 30
                                      default: 0
                              status:
                                type: string
                                example: success
                              reason: {}
                              reward_action_key:
                                type: string
                                example: prediction-correct
                              invoked_action_id:
                                type: string
                                example: 003f3f71-afe9-484a-9c7e-7325a1715589
                        reason: {}
                        profile_id:
                          type: string
                          example: b6bb8205-22ee-4c67-9482-424331d65aa4
                        status:
                          type: string
                          example: success
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      parameters:
      - name: Authorization
        in: header
        required: true
        description: Producer token
        schema:
          type: string
          default: ''
      tags:
      - Batch Invoked Actions
