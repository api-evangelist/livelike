info:
  title: engagement-suite Reaction Emojis API
  version: '1'
servers:
- url: https://cf-blast.livelikecdn.com/api/v1
security:
- {}
tags:
- name: Reaction Emojis
paths:
  /reaction-emojis/:
    post:
      summary: Add a Reaction emoji to a pack
      description: ''
      operationId: create-reaction-emoji
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - pack_id
              - name
              - file
              properties:
                pack_id:
                  type: string
                  description: The ID of the Reaction pack to add the emoji
                name:
                  type: string
                  description: The name of the reaction emoji
                file:
                  type: string
                  description: The reaction emoji image file
                  format: binary
                order_index:
                  type: integer
                  description: Optional index to order the emoji in the reaction pack.  Smaller numbers sort first.
                  default: 0
                  format: int32
      responses:
        '201':
          description: '201'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"id\": \"f1ee16bd-2315-4204-acbd-c232cc338a13\",\n  \"url\": \"https://cf-blast.livelikecdn.com/api/v1/reaction-emojis/f1ee16bd-2315-4204-acbd-c232cc338a13/\",\n  \"name\": \"My Reaction Emoji\",\n  \"pack_id\": \"fd2cc73b-662b-4914-bb1c-341a0ce34a79\",\n  \"pack_url\": \"https://cf-blast.livelikecdn.com/api/v1/reaction-packs/fd2cc73b-662b-4914-bb1c-341a0ce34a79/\",\n  \"pack_name\": \"My Reaction Pack\",\n  \"file\": \"https://cf-blast-storage.livelikecdn.com/assets/f84a9bc4-ff46-4f7b-b174-78187a52e103.png\",\n  \"order_index\": 0,\n  \"mimetype\": \"image/png\"\n}\n"
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: f1ee16bd-2315-4204-acbd-c232cc338a13
                  url:
                    type: string
                    example: https://cf-blast.livelikecdn.com/api/v1/reaction-emojis/f1ee16bd-2315-4204-acbd-c232cc338a13/
                  name:
                    type: string
                    example: My Reaction Emoji
                  pack_id:
                    type: string
                    example: fd2cc73b-662b-4914-bb1c-341a0ce34a79
                  pack_url:
                    type: string
                    example: https://cf-blast.livelikecdn.com/api/v1/reaction-packs/fd2cc73b-662b-4914-bb1c-341a0ce34a79/
                  pack_name:
                    type: string
                    example: My Reaction Pack
                  file:
                    type: string
                    example: https://cf-blast-storage.livelikecdn.com/assets/f84a9bc4-ff46-4f7b-b174-78187a52e103.png
                  order_index:
                    type: integer
                    example: 0
                    default: 0
                  mimetype:
                    type: string
                    example: image/png
      deprecated: false
      tags:
      - Reaction Emojis
  /reaction-emojis/{id}/:
    patch:
      summary: Update a Reaction emoji
      description: ''
      operationId: update-reaction-emoji
      parameters:
      - name: id
        in: path
        description: Reaction Emoji ID
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - file
              properties:
                name:
                  type: string
                  description: The name of the reaction emoji
                file:
                  type: string
                  description: The reaction emoji image file
                  format: binary
                order_index:
                  type: integer
                  description: Optional index to order the emoji in the reaction pack.  Smaller numbers sort first.
                  default: 0
                  format: int32
                emoji_unicode:
                  type: string
                  description: Emoji character or unicode escape sequence for the same
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"id\": \"f1ee16bd-2315-4204-acbd-c232cc338a13\",\n  \"url\": \"https://cf-blast.livelikecdn.com/api/v1/reaction-emojis/f1ee16bd-2315-4204-acbd-c232cc338a13/\",\n  \"name\": \"My Reaction Emoji\",\n  \"pack_id\": \"fd2cc73b-662b-4914-bb1c-341a0ce34a79\",\n  \"pack_url\": \"https://cf-blast.livelikecdn.com/api/v1/reaction-packs/fd2cc73b-662b-4914-bb1c-341a0ce34a79/\",\n  \"pack_name\": \"My Reaction Pack\",\n  \"file\": \"https://cf-blast-storage.livelikecdn.com/assets/f84a9bc4-ff46-4f7b-b174-78187a52e103.png\",\n  \"emoji_unicode\": null,\n  \"order_index\": 0,\n  \"mimetype\": \"image/png\"\n}\n"
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: f1ee16bd-2315-4204-acbd-c232cc338a13
                  url:
                    type: string
                    example: https://cf-blast.livelikecdn.com/api/v1/reaction-emojis/f1ee16bd-2315-4204-acbd-c232cc338a13/
