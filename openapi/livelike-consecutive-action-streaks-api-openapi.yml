      operationId: create-a-periodic-streak-1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Name of the streak
                progress_action_key:
                  type: string
                  description: 'The action key '
                started_at:
                  type: string
                  description: ISO Datetime when the streak will start, if null then streak is started from the day of creation
                stopped_at:
                  type: string
                  description: ISO Datetime when the streak will stop being active, if null then streak will never end, unless its archived.
                freeze_start:
                  type: string
                  description: ISO Datetime for starting the freeze period for everyone, so that any action performed by user will not result in streak length or any miss will not reset their streak
                freeze_until:
                  type: string
                  description: ISO Datetime for ending the freeze period for everyone, so that any action performed by user will not result in streak length or any miss will not reset their streak
                freeze_reason:
                  type: string
                  description: Optional reason for freezing the streak, only valid if one of freeze_start or freeze_until is provided
                attributes:
                  type: array
                  items:
                    properties:
                      key:
                        type: string
                        description: Attribute key, eg. custom_id
                      value:
                        type: string
                        description: Value of the attribute key.
                    type: object
                profile_group_ids:
                  type: array
                  description: List of Livelike profile group ids to which this streak will be applicable, if not provided, streak will be available for all.
                  items:
                    type: string
                reset_action_key:
                  type: string
                  description: User action that will reset the streak.
              required:
              - name
              - progress_action_key
      summary: Copy of
      tags:
