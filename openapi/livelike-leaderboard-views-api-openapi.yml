  /{id}/:
    put:
      summary: Replace Profiles in a View
      description: Existing Profiles not in this set will be removed.
      operationId: replace-profiles-in-a-view
      parameters:
      - name: id
        in: path
        description: The Leaderboard View ID
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                profile_ids:
                  type: array
                  description: The IDs of the Profiles that are now assigned to this view.  An empty list will remove all existing Profiles.  The Profiles do not have to already exist as entries on the Leaderboard.
                  items:
                    type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"id\": \"8f24038e-c137-4190-a34f-dfd990a348d7\",\n  \"name\": \"North America\",\n  \"url\": \"https://cf-blast.livelikecdn.com/api/v1/leaderboard-views/8f24038e-c137-4190-a34f-dfd990a348d7/\",\n  \"leaderboard_id\": \"68baf816-53de-4a8b-a3d3-efb7a47c59c0\",\n  \"profiles_url\": \"https://cf-blast.livelikecdn.com/api/v1/leaderboard-views/8f24038e-c137-4190-a34f-dfd990a348d7/profiles/\",\n}"
      deprecated: false
      tags:
      - Leaderboard Views
    patch:
      summary: Add Profiles to a Leaderboard View
      description: Existing Profiles in the view will be preserved.
      operationId: add-profiles-to-a-leaderboard-view
      parameters:
      - name: id
        in: path
        description: The Leaderboard View ID
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - profile_ids
              properties:
                profile_ids:
                  type: array
                  description: One or more Profile IDs to add to the Leaderboard View.  The Profiles do not have to already exist as entries on the Leaderboard.
                  items:
                    type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"id\": \"8f24038e-c137-4190-a34f-dfd990a348d7\",\n  \"name\": \"North America\",\n  \"url\": \"https://cf-blast.livelikecdn.com/api/v1/leaderboard-views/8f24038e-c137-4190-a34f-dfd990a348d7/\",\n  \"leaderboard_id\": \"68baf816-53de-4a8b-a3d3-efb7a47c59c0\",\n  \"profiles_url\": \"https://cf-blast.livelikecdn.com/api/v1/leaderboard-views/8f24038e-c137-4190-a34f-dfd990a348d7/profiles/\",\n}"
