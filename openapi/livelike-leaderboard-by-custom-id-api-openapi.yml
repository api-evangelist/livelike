    get:
      summary: Get Leaderboard Details by Custom Id
      description: Getting leaderboard details by custom-id can be achieved by using the request below. Leaderboard details can be useful if you would like to know the name of the leaderboard or the type of reward a user can earn.
      operationId: get-leaderboard-by-custom-id
      parameters:
      - name: custom-id
        in: path
        description: Unique custom id mapped in your system
        schema:
          type: string
        required: true
      - name: client-id
        in: path
        description: Application Client Id
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"id\": \"{leaderboard_id}\",\n\t\t\"custom_id\": \"custom_id1\",\n    \"url\": \"https://cf-blast.livelikecdn.com/api/v1/leaderboards/{leaderboard_id}/\",\n    \"client_id\": \"{client_id}\",\n    \"name\": \"LiveLike Points Leaders\",\n    \"reward_item\": {\n        \"id\": \"5e1016ef-9cf8-450f-9ad6-5e3996f1cbb0\",\n        \"url\": \"https://cf-blast.livelikecdn.com/api/v1/reward-items/5e1016ef-9cf8-450f-9ad6-5e3996f1cbb0/\",\n        \"client_id\": \"client_id\",\n        \"name\": \"LiveLike Points\"\n    },\n    \"attributes\":[]\n    \"reward_item_id\": \"5e1016ef-9cf8-450f-9ad6-5e3996f1cbb0\",\n    \"is_locked\": false,\n    \"entries_url\": \"https://blastrt-prod-us-east-1.livelikecdn.com/services/leaderboards/{leaderboard_id}/entries\",\n    \"entry_detail_url_template\": \"https://blastrt-prod-us-east-1.livelikecdn.com/services/leaderboards/{leaderboard_id}/entries/{profile_id}\"\n}"
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      security: []
      tags:
      - Leaderboard By Custom Id
