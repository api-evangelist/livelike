      - name: custom-id
        in: path
        description: Unique Custom Id mapped in your system
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: The descriptive name of the leaderboard
                is_locked:
                  type: boolean
