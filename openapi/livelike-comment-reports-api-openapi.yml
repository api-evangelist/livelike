        required: false
      - in: query
        name: comment_author_id
        schema:
          type: string
        description: Comment Author's UUID
      - in: query
        name: report_count_gte
        schema:
          type: string
        description: comments reported more or equal number of times
      - in: query
        name: report_count_lte
