        schema:
          type: string
      - name: client_id
        in: query
        required: true
        schema:
          type: string
      - name: comment_board_id
        in: query
        schema:
          type: string
      - name: comment_id
        in: query
        schema:
          type: string
        description: Multiple comment_ids accepted. Must belong to same comment board.
      - name: report_status
        in: query
        description: pending/dismissed
        schema:
          type: string
          default: ''
      - in: query
        name: since
        schema:
          type: string
          format: date-time
      - in: query
        name: until
        schema:
          type: string
          format: date-time
      - in: query
        name: ordering
        schema:
          type: string
          default: -created_at
          enum:
          - created_at
          - -created_at
          - report_count
          - -report_count
