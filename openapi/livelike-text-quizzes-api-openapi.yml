paths:
  /text-quizzes/:
    post:
      summary: Create a Text Quiz
      description: ''
      operationId: create-a-text-quiz
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - program_id
              - question
              - choices
              properties:
                program_id:
                  type: string
                  description: The id of the program to create the Text Quiz for
                question:
                  type: string
                  description: The question or prompt asked by the Text Quiz
                choices:
                  type: array
                  description: The choices of the Text Quiz
                interactive_until:
                  type: string
                  description: The UTC time that the widget will stop accepting interactions
                  format: date
                playback_time_ms:
                  type: integer
                  description: Video playback time in milliseconds
                  format: int32
                custom_data:
                  type: string
                widget_attributes:
                  type: array
                  items:
                    properties:
                      key:
                        type: string
                      value:
                        type: string
                    required:
                    - key
                    - value
                    type: object
                sponsor_ids:
                  type: array
                  description: Links the ```sponsors``` with this Text Quiz. Note that only valid sponsor_ids will be linked to a Text Quiz.
                  items:
                    type: string
