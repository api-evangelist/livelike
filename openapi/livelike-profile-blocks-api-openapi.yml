        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value:
                    detail:
                    - Blocked profile not found
                Bad Request:
                  summary: Bad Request
                  value:
                    detail:
                    - Provide only one of blocked_profile_id or blocked_profile_custom_id
                If no blocked_profile_id or blocked_profile_custom_id provided:
                  summary: If no blocked_profile_id or blocked_profile_custom_id provided
                  value:
                    detail:
                    - Provide either blocked_profile_id or blocked_profile_custom_id
              schema:
                type: object
                properties:
                  blocked_profile_id:
                    type: array
                    items:
                      type: string
                      example: '''7eb85742-64d1-451d-966e-d8f8cfeab9221'' is not a valid UUID.'
        '409':
          description: '409'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"detail\": \"Profile is already blocked.\"\n}"
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: Profile is already blocked.
