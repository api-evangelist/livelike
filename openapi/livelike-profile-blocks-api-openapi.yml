openapi: 3.2.0
info:
  title: engagement-suite Profile Blocks API
  version: '1'
servers:
- url: https://cf-blast.livelikecdn.com/api/v1
security:
- {}
tags:
- name: Profile Blocks
paths:
  /profile-blocks/:
    post:
      summary: Block a Profile
      description: ''
      operationId: create-a-profile-block
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                blocked_profile_id:
                  type: string
                  description: profile uuid that is being blocked
                blocked_profile_custom_id:
                  type: string
                  description: profile custom id that is being blocked
                remove_relationships:
                  type: boolean
                  default: 'false'
                  description: When true, also remove any existing relationships (friend, follower, etc.) between the two profiles, in both directions. Unblocking does not restore them.
      responses:
        '201':
          description: '201'
          content:
            application/json:
