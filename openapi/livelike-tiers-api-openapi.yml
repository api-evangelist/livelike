paths:
  /tiers/:
    post:
      summary: Create Tier
      description: To Create tiers within a Tier Group
      operationId: create-tier
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - tier_group_id
              - title
              properties:
                tier_group_id:
                  type: string
                  description: UUID of the Tier Group under which the Tier should be created.
                title:
                  type: string
                description:
                  type: string
                image:
                  type: string
                  format: binary
                attributes:
                  type: array
                  items:
                    properties:
                      key:
                        type: string
                      value:
                        type: string
                    required:
                    - key
                    - value
                    type: object
      responses:
        '201':
          description: '201'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"id\": \"184ac59b-1efe-45ac-8458-a13ab0c139a5\",\n    \"url\": \"http://localhost:8888/api/v1/tiers/184ac59b-1efe-45ac-8458-a13ab0c139a5/\",\n    \"tier_group_id\": \"0e008f1d-f81d-41b4-965d-12a0c2140864\",\n    \"tier_group\": \"Hack Your Way to the Top\",\n    \"reward_item_id\": null,\n    \"reward_item_name\": null,\n    \"attributes\": [],\n    \"order\": 5,\n    \"status\": \"active\",\n    \"title\": \"Platinum\",\n    \"image\": null,\n    \"description\": null,\n    \"reward_item_threshold\": null,\n    \"created_at\": \"2025-04-10T06:13:11.996887Z\"\n}"
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: 184ac59b-1efe-45ac-8458-a13ab0c139a5
                  url:
                    type: string
                    example: http://localhost:8888/api/v1/tiers/184ac59b-1efe-45ac-8458-a13ab0c139a5/
                  tier_group_id:
                    type: string
                    example: 0e008f1d-f81d-41b4-965d-12a0c2140864
                  tier_group:
                    type: string
                    example: Hack Your Way to the Top
                  reward_item_id: {}
                  reward_item_name: {}
                  attributes:
                    type: array
                  order:
                    type: integer
                    example: 5
                    default: 0
                  status:
                    type: string
                    example: active
                  title:
                    type: string
                    example: Platinum
                  image: {}
                  description: {}
                  reward_item_threshold: {}
                  created_at:
                    type: string
                    example: '2025-04-10T06:13:11.996887Z'
        '400':
