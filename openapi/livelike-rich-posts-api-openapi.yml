      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - program_id
              properties:
                content:
                  type: string
                  description: HTML content of the post.
                title:
                  type: string
                  description: Optional title of the rich post. Max length 200 characters
                program_id:
                  type: string
                  description: The program to create the rich post inside of
                sponsor_ids:
                  type: array
                  description: Links the ```sponsors``` with this Rich Post. Note that only valid sponsor_ids will be linked to a Rich Post.
