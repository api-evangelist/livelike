info:
  title: engagement-suite Invoked Actions API
  version: '1'
servers:
- url: https://cf-blast.livelikecdn.com/api/v1
security:
- {}
tags:
- name: Invoked Actions
paths:
  /invoked-actions/:
    get:
      summary: List Invoked Reward Actions
      description: Invoke actions to trigger the rewards engine for that action
      operationId: list-invoked-reward-actions
      parameters:
      - name: client_id
        in: query
        description: The application's Client ID
        required: true
        schema:
          type: string
      - name: code
        in: query
        description: The integrator-defined disambiguation code
        schema:
          type: string
      - name: profile_id
        in: query
        description: Limit results to a Profile ID.  Repeat this parameter to filter for multiple Profile IDs
        schema:
          type: string
      - name: reward_action_key
        in: query
        description: Limit results to a Reward Action key.  Repeat this parameter to filter for multiple Reward Action keys
        schema:
          type: string
      - name: program_id
        in: query
        description: Limit results to a Program ID
        schema:
          type: string
      - name: since
        in: query
        description: Filter for Invoked Actions created after a specific Date/Time
        schema:
          type: string
          format: date
      - name: until
        in: query
        description: Filter for Invoked Actions created before a specific Date/Time
        schema:
          type: string
          format: date
      - name: ordering
        in: query
        description: Order results by created Date/Time.  Use `-created_at` to see most recent results first
        schema:
          type: string
          default: created_at
      - name: attributes
        in: query
        description: 'Filter for actions with the given attributes.  Example: `attributes=key:value`.  This parameter can be repeated.'
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"count\": 1,\n  \"next\": null,\n  \"previous\": null,\n  \"results\": [\n    {\n      \"id\": \"9575428e-98a1-4c74-85fc-b2943f024224\",\n      \"created_at\": \"2021-01-11T21:57:55.466092Z\",\n      \"client_id\": \"pnODbVXg0UI80s0l2aH5Y7FOuGbftoAdSNqpdvo6\",\n      \"program_id\": \"47c14e1d-5786-401e-a850-22c5a91a5399\",\n      \"profile_id\": \"d70d8ad0-0753-4f2e-b00c-6defc295def7\",\n      \"profile_nickname\": \"Expert Trainer\",\n      \"reward_action_key\": \"hulk-slam\",\n      \"code\": \"2021-01-11\",\n      \"rewards\": [\n        {\n          \"reward_item_id\": \"ceb8b15e-3cee-480f-b25c-68817ac1afc0\",\n          \"reward_item_name\": \"Hulk Points\",\n          \"reward_item_amount\": 100\n        }\n      ]\n    }\n  ]\n}\n"
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    example: 1
                    default: 0
                  next: {}
                  previous: {}
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: 9575428e-98a1-4c74-85fc-b2943f024224
                        created_at:
                          type: string
                          example: '2021-01-11T21:57:55.466092Z'
                        client_id:
                          type: string
                          example: pnODbVXg0UI80s0l2aH5Y7FOuGbftoAdSNqpdvo6
                        program_id:
                          type: string
                          example: 47c14e1d-5786-401e-a850-22c5a91a5399
                        profile_id:
                          type: string
                          example: d70d8ad0-0753-4f2e-b00c-6defc295def7
                        profile_nickname:
                          type: string
                          example: Expert Trainer
                        reward_action_key:
                          type: string
                          example: hulk-slam
                        code:
                          type: string
                          example: '2021-01-11'
                        rewards:
                          type: array
                          items:
                            type: object
                            properties:
                              reward_item_id:
                                type: string
                                example: ceb8b15e-3cee-480f-b25c-68817ac1afc0
                              reward_item_name:
                                type: string
                                example: Hulk Points
                              reward_item_amount:
                                type: integer
                                example: 100
                                default: 0
        '409':
          description: '409'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"detail\": \"code already used.\"\n}\n"
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: code already used.
      deprecated: false
      tags:
      - Invoked Actions
    post:
      summary: Invoke Reward Action
      description: Invoke actions to trigger the rewards engine for that action
      operationId: invoking-custom-actions
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - program_id
              - profile_id
              - reward_action_key
              properties:
                program_id:
                  type: string
                  description: Program ID
                profile_id:
                  type: string
                  description: Profile ID  (Conflicts with Custom profile ID)
                custom_profile_id:
                  type: string
                  description: Custom profile ID (Conflicts with Profile ID)
                reward_action_key:
                  type: string
                  description: Reward action key
                code:
                  type: string
                  description: Integrator-defined disambiguation code
                attributes:
                  type: array
                  description: Attributes array
                  items:
                    properties:
                      key:
                        type: string
                      value:
                        type: string
                    required:
                    - key
                    - value
                    type: object
                description:
                  type: string
                  description: Optional description for invoking the action.
      responses:
        '201':
          description: '201'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"id\": \"7f6e1be0-6b8d-43d0-914d-7227c8608ec1\",\n  \"created_at\": \"2021-01-09T19:53:34.898831Z\",\n  \"program_id\": \"8d1885c6-1635-4d41-8904-76f3e86eeb49\",\n  \"profile_id\": \"947d3a03-f87f-4146-8e32-043db3fdd25f\",\n  \"reward_action_key\": \"my-custom-action\",\n  \"code\": \"my-disambiguation-code,\n  \"rewards\": [\n    {\n      \"reward_item_id\": \"194d4d03-b7c0-4b72-bf7f-1974c92a4709\",\n      \"reward_item_name\": \"Test Points\",\n      \"reward_item_amount\": 5\n    }\n  ],\n  \"description\": \"Sample Description.\"\n}\n"
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Both Profile Id and Custom Id are provided:
                  value: '{"detail":"Body params profile_uuid and custom_profile_id must not be passed together."}'
                Missing Profile Id and Custom Id:
                  value: '{"detail":"profile_id or custom_profile_id is required."}'
                Profile Id - not valid UUID:
                  value: '{"detail":"profile_id is not a valid UUID."}'
              schema:
                oneOf:
                - title: Both Profile Id and Custom Id are provided
                  type: object
                  properties:
                    detail:
                      type: string
                      example: Body params profile_uuid and custom_profile_id must not be passed together.
                - title: Missing Profile Id and Custom Id
                  type: object
                  properties:
                    detail:
                      type: string
                      example: profile_id or custom_profile_id is required.
                - title: Profile Id - not valid UUID
                  type: object
                  properties:
                    detail:
                      type: string
                      example: profile_id is not a valid UUID.
        '404':
          description: '404'
          content:
            application/json:
              examples:
                Profile Id only - Not Found:
                  value: '{"detail":"No profile found from input profile uuid."}'
                Result:
                  value: '{"detail":"No profile found from input profile uuid."}'
              schema:
                oneOf:
                - title: Profile Id only - Not Found
                  type: object
                  properties:
                    detail:
                      type: string
                      example: No profile found from input profile uuid.
                - type: object
                  properties:
                    detail:
                      type: string
                      example: No profile found from input profile uuid.
        '409':
          description: '409'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"detail\": \"code already used.\"\n}\n"
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: code already used.
      deprecated: false
      tags:
      - Invoked Actions
