    get:
      summary: Get List of Base Roles
      description: ''
      operationId: get-list-of-base-roles
      parameters:
      - name: client_id
        in: query
        description: Filter roles by a specific application
        schema:
          type: string
      - name: created_since
        in: query
        description: Filter by creation date since a particular timestamp
        schema:
          type: string
      - name: created_until
        in: query
        description: Filter by creation date until a particular timestamp
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
