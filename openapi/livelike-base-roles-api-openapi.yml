  /base-roles/{id}:
    delete:
      summary: Delete a Base Role
      description: ''
      operationId: delete-a-base-role
      parameters:
      - name: id
        in: path
        description: id of the base role to be deleted
        schema:
          type: string
        required: true
      responses:
        '204':
          description: '204'
          content:
            application/json:
              examples:
                Result:
                  value: ''
        '404':
          description: '404'
          content:
            text/plain:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Base Roles
  /base-roles/{id}/:
    patch:
      summary: Patch Update a Base Role
      description: Used to add permissions, and update the key/name of the base role. Patch Update adds the supplied permissions to existing ones in the supplied base role.
      operationId: patch-update-a-base-role
      parameters:
      - name: id
        in: path
        description: id of the base role to be updated
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: new name for the base role
                description:
                  type: string
                  description: new description for the base role
                key:
                  type: string
                  description: new key for the base role
                permission_ids:
                  type: array
                  description: permission_ids to be added
                  items:
                    type: string
                permission_keys:
                  type: array
                  description: permission_keys to be added
                  items:
                    type: string
                role_template_id:
                  type: string
                  description: id of the role template, permissions of which need to be added to the base role
                role_template_key:
                  type: string
                  description: key of the role template, permissions of which need to be added to the role
                is_active:
                  type: boolean
                  description: Active status for the base role
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
