    put:
      summary: Put Update a Base Role
      description: Used to replace existing permissions in a base role to a new set of permissions, and also update name/key of the base role
      operationId: put-update-a-base-role
      parameters:
      - name: id
        in: path
        description: id of the role to be updated
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
