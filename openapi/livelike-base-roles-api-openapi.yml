      summary: Create a Base Role
      description: ''
      operationId: create-a-base-role
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - key
              properties:
                name:
                  type: string
                  description: name of the base role to be created
                description:
                  type: string
                  description: description for the base role being created
                key:
                  type: string
                  description: key of the base role to be created
                permission_ids:
                  type: array
                  description: Array of permission_ids to add to the base role
                  items:
                    type: string
                permission_keys:
                  type: array
                  description: Array of permission_keys to add to the base role
                  items:
                    type: string
                role_template_id:
                  type: string
                  description: id of the role template to add permissions from
                role_template_key:
                  type: string
