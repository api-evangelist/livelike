      - in: path
        name: client-id
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                type: object
                properties:
                  previous: {}
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        reactions:
                          type: array
