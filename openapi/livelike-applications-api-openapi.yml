  /{client_id}/:
    patch:
      summary: Update an Application
      description: This API requires using a Personal API Token. The requester must be an Admin in the organization
      operationId: update-an-application
      parameters:
      - name: client_id
        in: path
        description: The Application Client ID
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: The application name
                default_chat_room_content_filter:
                  type: string
                  description: The default content filter applied to new chat rooms created in the application.  Choices are "none" (no filtering), "profanity" (profanity is filtered), and "producer" (only Producer users can post chat messages.)
                  default: none
                block_policy:
                  type: string
                  enum:
                  - disabled
                  - active
                  - active_and_passive
                  description: Controls how block relationships restrict actions and visibility
