  /applications/{client-id}/reaction-space-counts/:
    get:
      summary: Get user reaction count
      description: ''
      operationId: get-user-reaction-count
      parameters:
      - name: reaction_space_id
        in: query
        required: true
        schema:
          type: string
      - name: target_group_id
        in: query
