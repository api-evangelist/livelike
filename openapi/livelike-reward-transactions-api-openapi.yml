paths:
  /reward-transactions/:
    get:
      summary: List Reward Transactions
      description: List reward transactions for earned reward items
      operationId: list-reward-transactions
      parameters:
      - name: widget_id
        in: query
        description: Filters transactions by widget ID
        schema:
          type: string
      - name: widget_kind
        in: query
        description: Filters transactions by kind of widget, e.g. `text-poll`
        schema:
          type: string
      - name: profile_id
        in: query
        description: Filter transactions by destination profile ID
        schema:
          type: string
      - name: reward_item_id
        in: query
        description: Filter transactions by reward item ID
        schema:
          type: string
      - name: reward_action_key
        in: query
        description: Filter transactions by reward_action_key
        schema:
          type: string
      - name: created_since
        in: query
        schema:
          type: string
          format: date
      - name: created_until
        in: query
        schema:
          type: string
          format: date
      - name: attributes
        in: query
        description: Filter transactions by atribute's key/value
        schema:
          type: string
      - in: query
        name: expires_at
        schema:
          type: string
        description: Effective expiry — the earlier of the transaction's own expires_at and the reward item's earning_ends_at.
      - in: query
        name: user_multiplier_url
        schema:
          type: string
        description: Link to this profile's reward-multiplier resource.
      - in: query
        name: idempotency_key
        schema:
          type: string
        description: Client-supplied key used to dedupe transaction creation requests.
      - in: query
        name: transaction_type
        schema:
          type: string
          enum:
          - credit
          - debit
      - in: query
        name: expires_at_since
        schema:
          type: string
          format: date-time
        description: Filters reward transactions whose expires_at is on or after the specified date and time
      - in: query
        name: expires_at_until
        schema:
          type: string
          format: date-time
        description: Filters reward transactions whose expires_at is on or before the specified date and time.
      responses:
        '200':
          description: '200'
