      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - program_id
              - question
              - choices
              properties:
                program_id:
                  type: string
                  description: The id of the program to create the Image Quiz for
                question:
                  type: string
                  description: The question or prompt asked by the Image Quiz
                choices:
                  type: array
                  description: The choices of the Image Quiz
                interactive_until:
                  type: string
                  description: The UTC time that the widget will stop accepting interactions
                  format: date
                playback_time_ms:
                  type: integer
                  description: Video playback time in milliseconds
                  format: int32
                custom_data:
                  type: string
                widget_attributes:
                  type: array
                  items:
                    properties:
                      key:
                        type: string
                      value:
                        type: string
                    required:
                    - key
                    - value
                    type: object
                sponsor_ids:
                  type: array
                  description: Links the ```sponsors``` with this Image Quiz. Note that only valid sponsor_ids will be linked to a Image Quiz.
                  items:
                    type: string
