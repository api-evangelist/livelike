  /quest-tasks/:
    post:
      summary: Create Task
      description: ''
      operationId: create-task
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - quest_id
              - name
              properties:
                quest_id:
                  type: string
                  description: the id of the quest that this task belongs to
                name:
                  type: string
                description:
                  type: string
                attributes:
                  type: array
                  description: key and value pairs
      responses:
        '201':
          description: '201'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n\t\"id\": \"bd621545-a75d-4e0b-8698-13080a9597ce\",\n\t\"name\": \"Send 5 emails\",\n\t\"description\": \"Send 5 emails to complete this task\",\n\t\"quest_id\": \"5740fd51-200d-4488-84d7-58cfe08cc947\",\n\t\"progress_threshold\": 5,\n    \"attributes\": [\n        {\n            \"key\": \"c\",\n            \"value\": \"cc\"\n        },\n        {\n            \"key\": \"d\",\n            \"value\": \"dd\"\n        }\n    ]\n\t\"created_at\": \"2022-06-27T17:09:36.460679Z\"\n}"
