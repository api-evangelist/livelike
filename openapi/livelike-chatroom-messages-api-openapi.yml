paths:
  /chatroom-messages/:
    post:
      summary: Send a Chat Message
      description: ''
      operationId: send-chat-message
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - chat_room_id
              - message_event
              - message
              properties:
                chat_room_id:
                  type: string
                sender_image_url:
                  type: string
                badge_image_url:
                  type: string
                sender_profile_url:
                  type: string
                message_event:
                  type: string
                  enum:
                  - message-created
                  - image-created
                sender_nickname:
                  type: string
                program_date_time:
                  type: string
                  format: date
                message:
                  type: string
                  description: this field is required when message_event is message-created
                image_url:
                  type: string
                  description: this field is required when message_event is image-created
                image_height:
                  type: integer
                  format: int32
                image_width:
                  type: integer
                  format: int32
                quote_message_id:
                  type: string
                quote_message:
                  type: object
                  description: this field contains message object, and must follow all the required parameters for message
                  properties: {}
                message_metadata:
                  type: object
                  properties: {}
                parent_message_id:
                  type: string
                  description: parent message for this specific reply in the message thread
                mentions:
                  type: array
                  description: Details of the mentioned profiles and their location in the message
                  properties:
                    mentioned_profile_id:
                      type: string
                      description: The ID of the profile to mention
                    mentioned_profile_custom_id:
                      type: string
                      description: The Custom ID of the profile to mention
                    start_index:
                      type: integer
                      description: The beginning index of the message text to treat as a mention
                    end_index:
                      type: integer
                      description: The ending index of the message text to treat as a mention
                  required:
                  - start_index
                  - end_index
                  items:
                    properties: {}
                    type: object
                attributes:
                  type: array
                  items:
                    properties: {}
                    type: object
                  description: "A list of key/val pair attributes. \n[{\"key\": \"key1\", \"value\": \"val1\"},...]"
      responses:
        '201':
          description: '201'
          content:
            application/json:
              examples:
                Result:
                  value:
                    image_url: null
                    created_at: 2022-03-15T11:15:07+0000
