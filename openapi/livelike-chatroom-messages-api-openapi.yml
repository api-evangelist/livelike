    get:
      summary: List Chat Messages
      description: ''
      operationId: get-chatroom-messages
      parameters:
      - name: chat_room_id
        in: query
        description: chatroom id
        required: true
        schema:
          type: string
      - name: since
        in: query
        description: ISO datetime format
        schema:
          type: string
      - name: until
        in: query
        description: ISO datetime format
        schema:
          type: string
      - name: page_size
        in: query
        schema:
          type: integer
          format: int32
          default: 20
      - name: since_message_id
        in: query
        schema:
          type: string
      - name: parent_message_id
        in: query
        description: List replies to the provided message_id
        schema:
          type: string
      - name: quoted_sender_id
        in: query
        required: false
        description: Filter messages containing quoted messages from specified sender
        schema:
          type: string
          default: ''
      responses:
