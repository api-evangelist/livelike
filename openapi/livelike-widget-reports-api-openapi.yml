    get:
      summary: List widget reports
      description: ''
      operationId: list-widget-reports
      parameters:
      - name: client_id
        in: query
        description: Application Client ID
        schema:
          type: string
      - name: program_id
        in: query
        description: Program ID
        schema:
          type: string
      - name: widget_kind
        in: query
        description: Widget kind
        schema:
          type: string
      - name: widget_id
        in: query
        description: Widget ID
        schema:
          type: string
      - name: created_by_id
        in: query
        description: ID of the profile that submitted the widget report
        schema:
          type: string
      - name: created_since
        in: query
        description: Filter widget report created since this time
        schema:
          type: string
          format: date
      - name: created_until
        in: query
        description: Filter widget reports created before this time
        schema:
          type: string
          format: date
      - name: moderated_by_id
        in: query
        description: The ID of the profile that moderated the widget report
        schema:
          type: string
      - name: moderated_since
        in: query
        description: Filter widget reports moderated since this time
        schema:
          type: string
          format: date
      - name: moderated_until
        in: query
        description: Filter widget reports moderated before this time
        schema:
          type: string
          format: date
      - name: status
        in: query
        description: Filter widget reports with a specific status.  Can be one of pending, accepted, dismissed.
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
