      summary: Report a widget
      description: ''
      operationId: report-a-widget
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - widget_kind
              - widget_id
              properties:
                widget_kind:
                  type: string
                  description: The widget kind.  Example text-poll
                  enum:
                  - text-quiz
                  - text-ask
                  - text-poll
                  - text-prediction
                  - image-prediction
                  - image-number-prediction
                  - image-poll
                  - image-quiz
                  - alert
                  - video-alert
                  - cheer-meter
                  - emoji-slider
                  - rich-post
                  - social-embed
                widget_id:
                  type: string
                  description: The ID of the widget
                comment:
                  type: string
                  description: Optional comment to add to the widget report
