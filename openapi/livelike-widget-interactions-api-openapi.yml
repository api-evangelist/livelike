info:
  title: Livelike Widget Interactions API
  version: '1'
  description: 'Operations tagged Widget Interactions across 2 of this provider''s published API definitions: livelike-engagement-suite-openapi.yml, livelike-profiles-openapi.yml. Each path carries the servers of the definition it was published in.'
