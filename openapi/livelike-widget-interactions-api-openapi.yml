tags:
- name: Widget Interactions
paths:
  /widget-interactions/image-poll/{widget_id}/options/{option_id}/votes/:
    post:
      summary: Create a Poll Vote
      description: ''
      operationId: create-poll-vote
      parameters:
      - name: widget_id
        in: path
        description: The ID of the widget
        schema:
          type: string
        required: true
      - name: option_id
        in: path
        description: The ID of the option
        schema:
          type: string
        required: true
      responses:
        '201':
          description: '201'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"created_at\": \"2024-04-11T12:45:51+0000\",\n  \"id\": \"42fe5185-d3b5-4f24-b935-fade41022cbc\",\n  \"option_id\": \"deacfd3f-afc2-4ac1-82b7-e044d3276d4b\",\n  \"profile_id\": \"fc387945-ce92-45dd-9fbf-63275a030f83\",\n  \"rewards\": [\n    {\n      \"leaderboard_id\": \"30851aef-1472-4c2a-a1c3-8808b348964d\",\n      \"leaderboard_name\": \"Demo Leaderboard\",\n      \"new_percentile_rank\": \"1.000\",\n      \"new_rank\": 12,\n      \"new_score\": 433,\n      \"reward_action\": \"poll-voted\",\n      \"reward_item_amount\": 100,\n      \"reward_item_id\": \"bd95a4c0-9b97-4aa0-9dc7-2cf5957b4ca3\",\n      \"reward_item_name\": \"Demo Points\",\n    }\n  ],\n  \"url\": \"https://cf-blast.livelikecdn.com/api/v1/widget-interactions/image-poll/9dbf0690-17e5-41c3-a09d-238deb144a01/votes/42fe5185-d3b5-4f24-b935-fade41022cbc/\",\n  \"widget_id\": \"9dbf0690-17e5-41c3-a09d-238deb144a01\",\n  \"widget_kind\": \"image-poll\"\n}"
      deprecated: false
      tags:
      - Widget Interactions
    servers:
    - url: https://cf-blast.livelikecdn.com/api/v1
  /{profile_id}/widget-interactions/:
    get:
      summary: Get Widget Interactions
      description: ''
      operationId: get-widget-interactions
      parameters:
      - name: profile_id
        in: path
        description: Profile Id
        schema:
          type: string
        required: true
      - name: text_poll_id
        in: query
        schema:
          type: string
      - name: image_poll_id
        in: query
        schema:
          type: string
      - name: text_quiz_id
        in: query
        schema:
          type: string
      - name: image_quiz_id
        in: query
        schema:
          type: string
      - name: text_prediction_id
        in: query
        schema:
          type: string
      - name: image_prediction_id
        in: query
        schema:
          type: string
      - name: widget_kind
        in: query
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"previous\": null,\n  \"count\": 1,\n  \"next\": null,\n  \"results\": [\n    {\n      \"interactions\": {\n        \"emoji-slider\": [\n          {\n            \"magnitude\": \"1.000\",\n            \"widget_id\": \"1d02e416-4295-42b2-a564-2084396ef53a\",\n            \"profile_id\": \"6a678dce-89f8-48b4-9fed-74feb10927b1\",\n            \"widget_kind\": \"emoji-slider\",\n            \"created_at\": \"2020-01-13T16:11:07.580+00\",\n            \"id\": \"0fee3d5b-6dbb-455b-abd5-f35ba29f11ec\",\n            \"url\": \"https://cf-blast.livelikecdn.com/api/v1/profiles/6a678dce-89f8-48b4-9fed-74feb10927b1/widget-interactions/emoji-slider/1d02e416-4295-42b2-a564-2084396ef53a/0fee3d5b-6dbb-455b-abd5-f35ba29f11ec/\"\n          }\n        ],\n        \"image-quiz\": [\n          {\n            \"choice_id\": \"9853908c-8910-452c-83e3-fcc5d2dfd392\",\n            \"is_correct\": true,\n            \"widget_id\": \"c22abaa5-83c0-430a-965f-c6d5f0af63d0\",\n            \"profile_id\": \"6a678dce-89f8-48b4-9fed-74feb10927b1\",\n            \"widget_kind\": \"image-quiz\",\n            \"created_at\": \"2019-08-12T15:14:35.610+00\",\n            \"id\": \"eea885aa-16e9-42bd-af15-3044585c866a\",\n            \"url\": \"https://cf-blast.livelikecdn.com/api/v1/profiles/6a678dce-89f8-48b4-9fed-74feb10927b1/widget-interactions/image-quiz/c22abaa5-83c0-430a-965f-c6d5f0af63d0/eea885aa-16e9-42bd-af15-3044585c866a/\"\n          }\n        ]\n      }\n    }\n  ]\n}"
              schema:
                type: object
                properties:
                  previous: {}
                  count:
                    type: integer
                    example: 1
                    default: 0
                  next: {}
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        interactions:
                          type: object
                          properties:
                            emoji-slider:
                              type: array
                              items:
                                type: object
                                properties:
                                  magnitude:
                                    type: string
                                    example: '1.000'
                                  widget_id:
                                    type: string
                                    example: 1d02e416-4295-42b2-a564-2084396ef53a
                                  profile_id:
                                    type: string
                                    example: 6a678dce-89f8-48b4-9fed-74feb10927b1
                                  widget_kind:
                                    type: string
                                    example: emoji-slider
                                  created_at:
                                    type: string
                                    example: '2020-01-13T16:11:07.580+00'
                                  id:
                                    type: string
                                    example: 0fee3d5b-6dbb-455b-abd5-f35ba29f11ec
                                  url:
                                    type: string
                                    example: https://cf-blast.livelikecdn.com/api/v1/profiles/6a678dce-89f8-48b4-9fed-74feb10927b1/widget-interactions/emoji-slider/1d02e416-4295-42b2-a564-2084396ef53a/0fee3d5b-6dbb-455b-abd5-f35ba29f11ec/
                            image-quiz:
                              type: array
                              items:
                                type: object
                                properties:
                                  choice_id:
                                    type: string
                                    example: 9853908c-8910-452c-83e3-fcc5d2dfd392
                                  is_correct:
                                    type: boolean
                                    example: true
                                    default: true
                                  widget_id:
                                    type: string
                                    example: c22abaa5-83c0-430a-965f-c6d5f0af63d0
                                  profile_id:
                                    type: string
                                    example: 6a678dce-89f8-48b4-9fed-74feb10927b1
                                  widget_kind:
                                    type: string
                                    example: image-quiz
                                  created_at:
                                    type: string
                                    example: '2019-08-12T15:14:35.610+00'
                                  id:
                                    type: string
                                    example: eea885aa-16e9-42bd-af15-3044585c866a
                                  url:
                                    type: string
                                    example: https://cf-blast.livelikecdn.com/api/v1/profiles/6a678dce-89f8-48b4-9fed-74feb10927b1/widget-interactions/image-quiz/c22abaa5-83c0-430a-965f-c6d5f0af63d0/eea885aa-16e9-42bd-af15-3044585c866a/
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      security: []
      tags:
