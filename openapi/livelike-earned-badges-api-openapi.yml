security:
- {}
tags:
- name: Earned Badges
paths:
  /earned-badges/:
    get:
      summary: Get List of earned badges
      description: This API provides a list of badges earned by the requesting user if they are not an application producer. However, if the requesting user is an application producer, the API will return the badges owned by profiles in the entire application.
      operationId: get-list-of-earned-badges
      parameters:
      - name: profile_id
        in: query
        schema:
          type: string
      - name: badge_id
        in: query
        schema:
          type: string
      - name: Authorization
        in: header
        description: Bearer Token
        required: true
        schema:
          type: string
      - in: query
        name: reward_item_id
        schema:
          type: string
        description: Filter badges associated with the specified reward item.
      responses:
        '200':
          description: '200'
