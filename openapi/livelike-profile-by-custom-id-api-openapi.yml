tags:
- name: Profile By Custom Id
paths:
  /profile-by-custom-id/{client_id}/{custom_id}/:
    post:
      summary: Create Profile by Custom ID
      description: Create a new user profile with a custom ID
      operationId: create-profile-by-custom-id
      parameters:
      - name: client_id
        in: path
        description: The client ID of the application the profile was created in
        schema:
          type: string
        required: true
      - name: custom_id
        in: path
        description: The custom ID to be associated with the profile
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nickname:
                  type: string
                  description: If not provided, a randomized nickname will be assigned
                custom_data:
                  type: string
                  description: String data to send with the user profile.  Typically contains a string JSON payload to be decoded by the client SDK
                attributes:
                  type: array
                  items:
                    properties:
                      key:
                        type: string
                      value:
                        type: string
                    required:
                    - key
                    - value
                    type: object
