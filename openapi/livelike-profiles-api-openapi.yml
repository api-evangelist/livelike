openapi: 3.2.0
info:
  title: Livelike Profiles API
  version: '1.0'
  description: 'Operations tagged Profiles across 4 of this provider''s published API definitions: livelike-engagement-suite-openapi.yml, livelike-leaderboard-views-openapi.yml, livelike-new-application-openapi.yml, livelike-profiles-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://cf-blast.livelikecdn.com/api/v1
- url: https://cf-blast.livelikecdn.com/api/v1/leaderboard-views
- url: https://cf-blast.livelikecdn.com/api/v1/applications
- url: https://cf-blast.livelikecdn.com/api/v1/profiles
tags:
- name: Profiles
paths:
  /profiles/profile_id/reward-item-balances/:
    get:
      summary: List Reward Item Balances
      description: List reward item balances by passing reward_item_id
      operationId: list-reward-item-balances
      parameters:
      - name: reward_item_id
        in: query
        description: accepts one or multiple reward_item_ids
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"count\": 1,\n  \"next\": null,\n  \"previous\": null,\n  \"results\": [\n    {\n      \"reward_item_id\": \"26894d5d-1efa-4997-bfe0-7e105fdc474d\",\n      \"reward_item_name\": \"Game Changer Points\",\n      \"reward_item_balance\": 342\n    }\n  ]\n}"
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    example: 1
                    default: 0
                  next: {}
                  previous: {}
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        reward_item_id:
                          type: string
                          example: 26894d5d-1efa-4997-bfe0-7e105fdc474d
                        reward_item_name:
                          type: string
                          example: Game Changer Points
                        reward_item_balance:
                          type: integer
                          example: 342
                          default: 0
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      x-readme:
        code-samples:
        - language: curl
          code: 'curl --location --request GET ''https://cf-blast.livelikecdn.com/api/v1/profiles/{profile_id}/reward-item-balances/?reward_item_id={reward_id}&reward_item_id={reward_id2}'' \

            --header ''Authorization: Bearer {Access Token}'''
        samples-languages:
        - curl
      tags:
      - Profiles
      security:
      - {}
    servers:
    - url: https://cf-blast.livelikecdn.com/api/v1
  /profiles/{ProfileID}/permissions-check/:
    get:
      description: ''
      operationId: get_profiles{ProfileUUID}permissions-check
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties: {}
              examples:
                New Example:
                  summary: New Example
                  value:
                    results:
                    - permission_key: send_chat_message
                      resource_kind: chat_room
                      resource_key: room-uuid-123
                      scope_id: scope_id1
                      has_permission: true
                    - permission_key: ban_user
                      resource_kind: null
                      resource_key: null
                      scope_id: invalid_scope_id1
                      has_permission: false
                    - permission_key: moderate_comments
                      resource_kind: comment_board
                      resource_key: board-uuid-789
                      scope_id: null
                      has_permission: true
                    - permission_key: moderate_comments
                      resource_kind: invalid kind
                      resource_key: invalid key
                      scope_id: null
                      has_permission: false
      parameters:
      - in: path
        name: ProfileID
        schema:
          type: string
        required: true
        description: Profile UUID
      - in: query
        name: permission_key
        schema:
          type: string
        required: true
      - in: query
        name: scope_id
        schema:
          type: string
        description: scope object UUID
      - in: query
        name: resource_kind
        schema:
          type: string
        description: e.g comment-board, chat-room
      - in: query
        name: resource_key
        schema:
          type: string
        description: Entity/Object UUID. e.g comment-board-uuid
      tags:
      - Profiles
      security:
      - {}
      summary: Get profiles{profile UUID}permissions check
      x-summary-source: derived
    servers:
    - url: https://cf-blast.livelikecdn.com/api/v1
  /profiles/{id}/prizeout-session/:
    post:
      summary: Prizeout User Session
      description: ''
      operationId: prizeout-user-session
      parameters:
      - name: id
        in: path
        description: Unique ID of profile
        schema:
          type: string
        required: true
      - name: Authorization
        in: header
        description: Bearer <access-token>
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - country
              - region
              - year_of_birth
              properties:
                email:
                  type: string
                country:
                  type: string
                region:
                  type: string
                year_of_birth:
                  type: integer
                  format: int32
                firstname:
                  type: string
                lastname:
                  type: string
                gender:
                  type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"session_id\": \"fdf7f8bf-6d26-45cc-82ba-2211b0b67b84\",\n    \"profile_id\": \"6fa4e248-e214-43e8-9214-8ec790dcb9c6\",\n    \"email\": \"abcd@gmail.com\",\n    \"created_at\": \"2022-11-04T09:01:17.352135Z\",\n    \"session_timeout\": \"P0DT00H30M00S\",\n    \"firstname\": \"AK\",\n    \"lastname\": \"KA\",\n    \"gender\": \"male\",\n    \"year_of_birth\": 1999,\n    \"country\": \"US\",\n    \"region\": \"MA\"\n}"
              schema:
                type: object
                properties:
                  session_id:
                    type: string
                    example: fdf7f8bf-6d26-45cc-82ba-2211b0b67b84
                  profile_id:
                    type: string
                    example: 6fa4e248-e214-43e8-9214-8ec790dcb9c6
                  email:
                    type: string
                    example: abcd@gmail.com
                  created_at:
                    type: string
                    example: '2022-11-04T09:01:17.352135Z'
                  session_timeout:
                    type: string
                    example: P0DT00H30M00S
                  firstname:
                    type: string
                    example: AK
                  lastname:
                    type: string
                    example: KA
                  gender:
                    type: string
                    example: male
                  year_of_birth:
                    type: integer
                    example: 1999
                    default: 0
                  country:
                    type: string
                    example: US
                  region:
                    type: string
                    example: MA
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"email\": [\n        \"This field is required.\"\n    ],\n    \"year_of_birth\": [\n        \"This field is required.\"\n    ],\n    \"country\": [\n        \"This field is required.\"\n    ],\n    \"region\": [\n        \"This field is required.\"\n    ]\n}"
              schema:
                type: object
                properties:
                  email:
                    type: array
                    items:
                      type: string
                      example: This field is required.
                  year_of_birth:
                    type: array
                    items:
                      type: string
                      example: This field is required.
                  country:
                    type: array
                    items:
                      type: string
                      example: This field is required.
                  region:
                    type: array
                    items:
                      type: string
                      example: This field is required.
      deprecated: false
      tags:
      - Profiles
      security:
      - {}
    servers:
    - url: https://cf-blast.livelikecdn.com/api/v1
  /profiles/{profile-id}/comment-replies/:
    get:
      summary: List Replies to Profile's Comments
      description: This API endpoint retrieves all replies made by other users to comments created by a specific profile. For example, if a profile named "ray" has created 10 comments, this API will list all the replies made to those 10 comments by other users.
      operationId: list-replies-to-profiles-comments
      parameters:
      - name: since
        in: query
        description: Filters all the replies since this time
        schema:
          type: string
      - name: until
        in: query
        description: Filter all the replies until this time
        schema:
          type: string
      - name: comment_board_id
        in: query
        description: Filters all the comments for this comment_board
        schema:
          type: string
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '200'
