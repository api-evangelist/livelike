  /profiles/{profile_id}/reward-item-credits/:
    post:
      summary: Credit Reward Item
      description: Credit reward item points to a user profile
      operationId: credit-reward-item
      parameters:
      - name: profile_id
        in: path
        schema:
          type: string
          default: ''
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reward_item_id:
                  type: string
                  default: ''
                reward_item_amount:
                  type: integer
                  default: ''
                  format: int32
                description:
                  type: string
                  description: optional description for crediting the reward. eg. attended an away game vs Atlanta Braves on April 30th
                custom_data:
                  type: string
                  description: String data to send with the reward item credit. Typically contains a string JSON payload to be decoded by the client SDK
                attributes:
                  type: array
                  description: Key/value set of attributes to create that will be linked to the reward item
                  items:
                    properties:
                      key:
                        type: string
                      value:
                        type: string
                    required:
                    - key
                    - value
                    type: object
                reason:
                  type: string
                  description: Optional reason for crediting the reward. eg. attend a game
                leaderboard_ids:
                  type: array
                  items:
                    type: string
                  description: List of leaderboard UUIDs to update; if provided, only those leaderboards are updated; if empty ([]), no linked leaderboards are updated; if omitted, all linked leaderboards are updated.
                expires_at:
                  type: string
                  description: Date after which the credited amount stops counting toward the profile's balance. Must be today or later, and can't exceed the reward item's earning_ends_at.
                  format: date
                idempotency_key:
                  type: string
                  description: Client-supplied dedup token — replaying the same key returns/short-circuits the existing transaction instead of creating a duplicate.
              required:
              - reward_item_id
              - reward_item_amount
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"new_balance\": 91,\n  \"created_at\": \"2021-09-21T22:06:39.906193Z\",\n  \"description\": \"Crediting 5 reward points for signup\",\n  \"custom_data\": \"{\\\"key\\\":\\\"key1\\\"}\",\n  \"prizeout_balance\": null,\n  \"attributes\": [\n    {\n      \"key\": \"size\",\n      \"value\": \"medium\"\n    }\n  ],\n  \"reason\": \"attend a game\",\n  \"description\": \"attended an away game vs Atlanta Braves on April 30th\",\n}"
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"attributes\": [\n        {\n            \"key\": [\n                \"This field is required.\"\n            ],\n            \"value\": [\n                \"This field is required.\"\n            ]\n        }\n    ]\n}"
              schema:
                type: object
