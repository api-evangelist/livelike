openapi: 3.2.0
info:
  title: engagement-suite Quests API
  version: '1'
servers:
- url: https://cf-blast.livelikecdn.com/api/v1
security:
- {}
tags:
- name: Quests
paths:
  /quests:
    get:
      summary: List Quests
      description: ''
      operationId: list-quests
      parameters:
      - name: client_id
        in: query
        required: true
        schema:
          type: string
      - name: attributes
        in: query
        description: key value pair to filter out quest based on attributes, should be used like ?attributes=key1:value1&attributes=key2:value2
        schema:
          type: string
      - name: has_profile_groups
        in: query
        description: filters quests based on whether they have profile groups linked with them or not.
        schema:
          type: boolean
      - name: profile_id
        in: query
        description: returns quests that have profile groups associated to a quest which this profile is part of.
        schema:
          type: string
      - name: profile_group_id
        in: query
        description: returns quests that are linked to this profile group id. ?profile_group_id=group1&profile_group_id=group2, will returns all of the quests that have both the groups attached.
        schema:
          type: string
      - name: include_public
        in: query
        description: Adds quests that does not have any profile group associated, can only be used with profile_group_id or profile_id.
        schema:
          type: boolean
      - in: query
        name: has_ab_test
        schema:
          type: boolean
        description: Returns Quests that have ab-test enabled, if not provided it returns both types of quests.
      - in: query
        name: ab_test_id
        schema:
          type: string
        description: Returns Quests with specific ab_test_id
      responses:
        '200':
          description: '200'
          content:
