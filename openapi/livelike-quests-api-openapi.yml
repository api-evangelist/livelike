  /quests/:
    post:
      summary: Create Quest
      description: ''
      operationId: create-quests
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - client_id
              - name
              properties:
                client_id:
                  type: string
                name:
                  type: string
                description:
                  type: string
                started_at:
                  type: string
                  format: date
                stopped_at:
                  type: string
                  format: date
                timeout:
                  type: string
                  description: ISO8601
                attributes:
                  type: array
                  description: key and value pairs
                leaderboard_ids:
                  type: array
                  description: Optional list of leaderboard UUIDs that should be updated when a user receives a reward for completing a quest. This field only takes effect if the leaderboard override flag is enabled for your application. To enable this flag, please contact Livelike.  By default, if the flag is disabled, all leaderboards linked to the awarded reward item will be updated automatically.
                  items:
                    type: string
      responses:
        '201':
          description: '201'
          content:
            application/json:
              examples:
