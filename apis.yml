aid: livelike

name: LiveLike

description: LiveLike is an AI-powered fan engagement platform used by sports teams, leagues, media companies, and venues to drive registration,
  retention, and monetization through interactive experiences. Its developer platform exposes a REST API, GraphQL, webhooks, and native SDKs (iOS,
  Android, Web, React Native) for building live interactive widgets (polls, quizzes, predictions, alerts), real-time chat and community features,
  gamification (leaderboards, badges, quests, streaks, rewards), user profiles, and analytics that can be synchronized to live and on-demand video.
  LiveLike also publishes an official Model Context Protocol (MCP) server so AI assistants can manage programs and widgets.

